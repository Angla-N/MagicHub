<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub · 登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<style>
  /* 页面专属：深紫星云背景 + 深色渐变蒙版（背景图直接使用用户素材，不改动） */
  body{background:url("assets/cover-bg.jpg") center/cover no-repeat fixed,var(--bg)}
  /* 登录页窗口标题栏：桌面壳下可拖动 */
  .login-titlebar{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(10,10,14,.5);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.05);
    padding:0 10px 0 16px}
  .login-titlebar .title{color:rgba(255,255,255,.6)}
  .login-titlebar .win-controls button{width:42px;height:46px;border-radius:0}
  .login-titlebar .win-controls button:hover{background:rgba(255,255,255,.1);color:var(--accent-soft)}
  .auth-page{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:86px 32px 40px}
  .auth-page::before{content:"";position:fixed;inset:0;z-index:0;
    background:linear-gradient(100deg,rgba(10,10,10,.92) 0%,rgba(14,14,14,.72) 45%,rgba(16,12,30,.62) 72%,rgba(20,16,38,.82) 100%)}
  /* 左右分栏：左侧品牌区 + 右侧登录卡片，填满画面避免大面积留白 */
  .auth-layout{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;
    gap:clamp(48px,6vw,96px);width:100%;max-width:1120px;flex-wrap:wrap}
  .auth-brand{flex:1 1 380px;max-width:520px;min-width:320px;color:var(--text-1)}
  .brand-logo{width:76px;height:76px;margin-bottom:22px;filter:drop-shadow(0 8px 28px rgba(124,58,237,.55))}
  .brand-logo svg{width:100%;height:100%;display:block}
  .brand-title{font-size:clamp(40px,5vw,54px);font-weight:800;letter-spacing:1px;margin:0 0 14px;
    background:linear-gradient(100deg,#EDE9FE 0%,#C4B5FD 38%,#A78BFA 68%,#7C3AED 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-slogan{font-size:17px;color:var(--text-2);margin:0 0 34px;letter-spacing:.5px}
  .brand-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
  .brand-feats li{display:flex;align-items:center;gap:14px;font-size:14.5px;color:var(--text-2)}
  .brand-feats svg{width:22px;height:22px;flex:none;color:var(--accent-soft);
    filter:drop-shadow(0 0 10px rgba(167,139,250,.45))}
  .brand-foot{margin-top:44px;font-size:12px;color:var(--text-3);letter-spacing:1px}
  /* 服务器地址配置：放在品牌区底部，不占用登录表单 */
  .brand-server{margin-top:18px;max-width:340px}
  .brand-server label{display:block;font-size:12px;color:var(--text-3);margin-bottom:8px;letter-spacing:.5px}
  .server-row{display:flex;align-items:center;gap:10px;background:rgba(30,30,30,.66);
    border:1px solid var(--border);border-radius:12px;padding:6px 12px;
    transition:border-color .2s,box-shadow .2s}
  .server-row:focus-within{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
  .server-row svg{width:18px;height:18px;flex:none;color:var(--text-3)}
  .server-row .input{flex:1;min-width:0;background:none;border:none;box-shadow:none;padding:7px 0;font-size:13px;color:var(--text-1)}
  .server-row .input:focus{outline:none}
  .server-check{flex:none;padding:6px 14px;border-radius:9px;background:rgba(124,58,237,.16);
    border:1px solid rgba(124,58,237,.45);color:var(--accent-soft);font-size:12px;cursor:pointer;
    transition:background .2s}
  .server-check:hover{background:rgba(124,58,237,.28)}
  .server-check:disabled{opacity:.55;cursor:wait}
  .server-tip{font-size:11px;color:var(--text-3);margin-top:7px;line-height:1.5}
  /* 服务器验证结果弹窗 */
  .check-modal-mask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:rgba(10,10,10,.66);backdrop-filter:blur(6px)}
  .check-modal-mask[hidden]{display:none}
  .check-modal{width:min(400px,86vw);background:#252526;border:1px solid var(--border);border-radius:16px;
    padding:26px 26px 20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .check-modal.ok{border-color:rgba(52,211,153,.4)}
  .check-modal.err{border-color:rgba(244,63,94,.4)}
  .check-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:10px}
  .check-title svg{width:22px;height:22px;flex:none}
  .check-modal.ok .check-title{color:#6ee7b7}
  .check-modal.err .check-title{color:#fda4af}
  .check-body{font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:18px;word-break:break-word}
  .check-close{width:100%;padding:10px;border-radius:10px;background:var(--grad);color:#fff;border:none;
    font-size:14px;cursor:pointer}
  .check-close:hover{filter:brightness(1.1)}
  .auth-card-col{flex:0 0 420px}
  .auth-card{background:rgba(37,37,38,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);
    border-radius:20px;padding:34px 34px 30px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .auth-card.wide{max-width:420px;width:100%}
  .card-title{margin:0 0 4px;font-size:24px;font-weight:700;color:var(--text-1)}
  .card-sub{margin:0 0 20px;font-size:13px;color:var(--text-3)}
  .reg-field{display:none;animation:regIn .25s ease both}
  @keyframes regIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .auth-card.reg .reg-field{display:block}
  .reg-row{display:flex;gap:12px;align-items:center}
  .avatar-pick{flex:none;width:64px;height:64px;border-radius:14px;overflow:hidden;position:relative;
    background:var(--surface-2);border:1px dashed var(--border);cursor:pointer;display:grid;place-items:center}
  .avatar-pick img{width:100%;height:100%;object-fit:cover;display:none}
  .avatar-pick .ph{color:var(--text-3);font-size:20px;display:grid;place-items:center}
  .avatar-pick:hover{border-color:var(--primary-strong);background:rgba(124,58,237,.12)}
  .avatar-tip{font-size:11px;color:var(--text-3);line-height:1.5}
  .avatar-preview{width:64px;height:64px;border-radius:14px;object-fit:cover;display:none}
  #avatarInput{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  /* 注册算术验证码 */
  .captcha-row{display:flex;gap:10px;align-items:center}
  .captcha-q{flex:none;min-width:86px;text-align:center;padding:8px 12px;border-radius:10px;
    background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.4);color:var(--accent-soft);
    font-size:14px;font-weight:700;letter-spacing:1px}
  .captcha-input{flex:1;min-width:0}
  .captcha-row .server-check{padding:8px 12px}
  .last-login{margin-top:2px;padding:8px 12px;border-radius:10px;background:rgba(124,58,237,.12);
    border:1px solid rgba(124,58,237,.32);color:var(--text-2);font-size:12px}
  .last-login b{color:var(--accent-soft)}
  /* 窄屏：隐藏品牌区，仅居中登录卡片 */
  @media (max-width:900px){
    .auth-page{padding:24px 16px}
    .login-titlebar{display:none}
    .auth-brand{display:none}
    .auth-card-col{flex-basis:100%;max-width:420px}
  }
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 窗口标题栏：桌面壳下可拖动窗口 + 最小化/最大化/关闭 -->
<header class="titlebar login-titlebar">
  <span class="title">MagicHub · 登录</span>
  <div class="win-controls" aria-label="窗口控制">
    <button id="winMin" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="winMax" title="最大化/还原"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<div class="auth-page">
  <div class="auth-layout">

    <!-- 左侧品牌展示区 -->
    <section class="auth-brand">
      <div class="brand-logo"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#A78BFA"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#17171A"/></svg></div>
      <h1 class="brand-title">MagicHub</h1>
      <p class="brand-slogan">轻量 · 实时 · 可扩展的桌面聊天工作台</p>
      <ul class="brand-feats">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg><span>实时消息与文件传输，多端同步</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>插件系统，能力按需扩展</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>内置服务器，开箱即用</span></li>
      </ul>
      <div class="brand-foot">MagicHub v0.4.0 · 深紫星云版</div>
      <div class="brand-server">
        <label for="server">服务器地址</label>
        <div class="server-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <input class="input" id="server" name="server" autocomplete="off" spellcheck="false"
                 placeholder="http://localhost:3000">
          <button type="button" class="server-check" id="serverCheck">验证</button>
        </div>
        <div class="server-tip">默认连接本机；连其他机器时填服务器 IP，如 http://192.168.1.100:3000</div>
      </div>
    </section>

    <!-- 右侧登录 / 注册卡片 -->
    <section class="auth-card-col">
      <div class="auth-card wide" id="authCard">
        <h2 class="card-title">欢迎回来</h2>
        <p class="card-sub">登录或注册，开始你的轻量聊天</p>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tabLogin" type="button">登录</button>
      <button class="tab" id="tabRegister" type="button">注册</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field" style="margin-top:18px">
        <label for="username">账号</label>
        <input class="input" id="username" name="username" autocomplete="username"
               placeholder="3-24 位字母、数字或下划线" maxlength="24">
      </div>

      <!-- 注册专属字段 -->
      <div class="reg-field field">
        <label for="displayName">名字</label>
        <input class="input" id="displayName" name="displayName" autocomplete="nickname"
               placeholder="怎么称呼你（1-32 个字符）" maxlength="32">
      </div>
      <div class="reg-field field">
        <label>头像</label>
        <div class="reg-row">
          <label class="avatar-pick" id="avatarPick" for="avatarInput" title="点击上传头像">
            <span class="ph" id="avatarPh">＋</span>
            <img id="avatarImg" alt="头像预览">
            <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp">
          </label>
          <span class="avatar-tip">选一张图片作头像（自动裁剪为方形圆角并压缩，保存到服务器）</span>
        </div>
      </div>

      <!-- 注册算术验证码（防脚本滥注册，服务端出题一次性） -->
      <div class="reg-field field">
        <label for="captcha">验证码</label>
        <div class="reg-row captcha-row">
          <span class="captcha-q" id="captchaQ">请切换到注册后加载</span>
          <input class="input captcha-input" id="captcha" name="captcha" autocomplete="off"
                 placeholder="计算结果" maxlength="3" inputmode="numeric">
          <button type="button" class="server-check" id="captchaRefresh" title="换一题">换一题</button>
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password"
               placeholder="至少 6 位" maxlength="64">
      </div>

      <div class="last-login" id="lastLogin" hidden>上次登录：<b id="lastLoginName"></b>，请输入密码登录</div>
      <div class="auth-error" id="authError"></div>
      <button class="btn btn-primary" id="submitBtn" type="submit">登 录</button>
    </form>

    <p class="auth-switch" id="switchHint">
      还没有账号？<button type="button" id="switchBtn">去注册</button>
    </p>
      </div>
    </section>
  </div>
</div>

<!-- 服务器验证结果弹窗 -->
<div class="check-modal-mask" id="checkMask" hidden>
  <div class="check-modal" id="checkModal">
    <div class="check-title" id="checkTitle"></div>
    <div class="check-body" id="checkBody"></div>
    <button class="check-close" id="checkClose" type="button">知道了</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  /* 窗口控制：Electron 桌面壳下生效；浏览器中隐藏标题栏 */
  var winBar = document.querySelector(".login-titlebar");
  if (window.magicHub && window.magicHub.minimize) {
    document.getElementById("winMin").addEventListener("click", function () { window.magicHub.minimize(); });
    document.getElementById("winMax").addEventListener("click", function () { window.magicHub.maximize(); });
    document.getElementById("winClose").addEventListener("click", function () { window.magicHub.close(); });
  } else if (winBar) {
    winBar.hidden = true;
  }
  var mode = "login"; // login | register
  var injected = (window.magicHub && window.magicHub.serverBase) || "";
  var serverEl = document.getElementById("server");
  // 服务器地址：上次保存的 > Electron 注入 > 本机默认
  serverEl.value = localStorage.getItem("magichub_server") || injected || "http://localhost:3000";
  /** 规范化服务器地址并即时保存 */
  function getAPI() {
    var v = serverEl.value.trim();
    if (!v) v = "http://localhost:3000";
    if (!/^https?:\/\//i.test(v)) v = "http://" + v;
    if (/\/$/.test(v)) v = v.slice(0, -1);
    return v;
  }
  var form = document.getElementById("authForm");
  var usernameEl = document.getElementById("username");
  var displayNameEl = document.getElementById("displayName");
  var passwordEl = document.getElementById("password");
  var errorEl = document.getElementById("authError");
  var submitBtn = document.getElementById("submitBtn");
  var tabLogin = document.getElementById("tabLogin");
  var tabRegister = document.getElementById("tabRegister");
  var switchBtn = document.getElementById("switchBtn");
  var switchHint = document.getElementById("switchHint");
  var authCard = document.getElementById("authCard");
  var avatarData = null; // base64 data URL（未选则为 null）

  /* ===== 注册算术验证码（服务端出题，一次性） ===== */
  var captcha = { id: null, q: null };
  var captchaQ = document.getElementById("captchaQ");
  function loadCaptcha() {
    var API = getAPI();
    fetch(API + "/api/register/captcha")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.ok) {
          captcha = d.data;
          captchaQ.textContent = d.data.question;
          document.getElementById("captcha").value = "";
        } else {
          captcha = { id: null, q: null };
          captchaQ.textContent = (d.error && d.error.message) || "获取失败，稍后重试";
        }
      })
      .catch(function () {
        captcha = { id: null, q: null };
        captchaQ.textContent = "服务器不可用，检查地址";
      });
  }
  document.getElementById("captchaRefresh").addEventListener("click", loadCaptcha);

  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle("on", m === "login");
    tabRegister.classList.toggle("on", m === "register");
    authCard.classList.toggle("reg", m === "register");
    submitBtn.textContent = m === "login" ? "登 录" : "注 册";
    switchHint.innerHTML = m === "login"
      ? '还没有账号？<button type="button" id="switchBtn2">去注册</button>'
      : '已有账号？<button type="button" id="switchBtn2">去登录</button>';
    document.getElementById("switchBtn2").addEventListener("click", function () {
      setMode(m === "login" ? "register" : "login");
    });
    errorEl.textContent = "";
    if (m === "register") loadCaptcha(); // 进入注册模式时加载/刷新验证码
  }

  tabLogin.addEventListener("click", function () { setMode("login"); });
  tabRegister.addEventListener("click", function () { setMode("register"); });
  switchBtn.addEventListener("click", function () { setMode(mode === "login" ? "register" : "login"); });

  function showError(msg) { errorEl.textContent = msg; }

  /* ===== 头像上传：读取 -> 中心裁剪 128x128 -> JPEG 压缩 -> 预览 ===== */
  var avatarInput = document.getElementById("avatarInput");
  var avatarImg = document.getElementById("avatarImg");
  var avatarPh = document.getElementById("avatarPh");

  avatarInput.addEventListener("change", function () {
    var file = avatarInput.files && avatarInput.files[0];
    if (!file) return;
    if (!/^image\/(png|jpeg|gif|webp)$/.test(file.type)) {
      showError("仅支持 PNG / JPG / GIF / WebP 图片");
      return;
    }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var size = 128;
      var canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#252526";
      ctx.fillRect(0, 0, size, size);
      var side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      avatarData = canvas.toDataURL("image/jpeg", 0.85);
      avatarImg.src = avatarData;
      avatarImg.style.display = "block";
      avatarPh.style.display = "none";
      URL.revokeObjectURL(url);
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      showError("图片读取失败，请换一张");
    };
    img.src = url;
  });

  /* ===== 提交 ===== */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var username = usernameEl.value.trim();
    var password = passwordEl.value;

    if (!/^[\w-]{3,24}$/.test(username)) {
      showError("账号需为 3-24 位字母、数字、下划线或短横线");
      return;
    }
    if (password.length < 6) {
      showError("密码至少 6 位");
      return;
    }

    var body;
    if (mode === "register") {
      var name = displayNameEl.value.trim();
      if (!name) { showError("请填写名字"); return; }
      if (name.length > 32) { showError("名字最长 32 个字符"); return; }
      if (!captcha.id) { showError("验证码未加载，请重试"); loadCaptcha(); return; }
      if (!document.getElementById("captcha").value.trim()) {
        showError("请完成验证码计算");
        return;
      }
      body = JSON.stringify({
        username: username, password: password, displayName: name, avatar: avatarData,
        captchaId: captcha.id, captchaAnswer: document.getElementById("captcha").value.trim(),
      });
    } else {
      body = JSON.stringify({ username: username, password: password });
    }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === "login" ? "登录中…" : "注册中…";
    var API = getAPI();

    fetch(API + (mode === "login" ? "/api/login" : "/api/register"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.ok) {
          if (mode === "register") {
            // 注册成功：预填账号，切回登录态提示去登录
            setMode("login");
            usernameEl.value = username;
            passwordEl.value = "";
            showError("");
            switchHint.innerHTML = "注册成功，请登录";
            submitBtn.disabled = false;
            submitBtn.textContent = "登 录";
            return;
          }
          // 登录成功：保存会话（含 token、资料与服务器地址），进入主界面
          var d = data.data || {};
          var serverBase = getAPI();
          localStorage.setItem("magichub_server", serverBase);
          localStorage.setItem("magichub_session", JSON.stringify({
            username: d.username,
            displayName: d.displayName || d.username,
            avatar: d.avatar || null,
            token: d.token,
            serverBase: serverBase,
            loginAt: Date.now()
          }));
          location.href = "index.html";
        } else {
          showError((data.error && data.error.message) || "操作失败，请重试");
          // 注册场景：验证码错误/过期/被限流时刷新题面
          if (mode === "register" && data.error && /BAD_CAPTCHA|RATE_LIMITED|LOCKED/.test(data.error.code || "")) {
            loadCaptcha();
          }
          submitBtn.disabled = false;
          submitBtn.textContent = mode === "login" ? "登 录" : "注 册";
        }
      })
      .catch(function () {
        showError("无法连接服务器，请检查服务器地址是否正确（默认 http://localhost:3000）");
        submitBtn.disabled = false;
        submitBtn.textContent = mode === "login" ? "登 录" : "注 册";
      });
  });

  // 默认停留在登录页：即使上次登录过也不自动进入，由用户确认登录后再进（避免 token 过期直接进入报"登录超时"）
  var last = localStorage.getItem("magichub_session");
  if (last) {
    try {
      var ls = JSON.parse(last);
      if (ls && ls.username) {
        document.getElementById("lastLoginName").textContent = ls.displayName || ls.username;
        document.getElementById("lastLogin").hidden = false;
        usernameEl.value = ls.username;
      }
    } catch (e) { /* 忽略损坏的会话 */ }
  }

  /* ===== 服务器地址验证：探测后端 /api/plugins，弹窗反馈结果 ===== */
  var checkBtn = document.getElementById("serverCheck");
  var checkMask = document.getElementById("checkMask");
  function showCheckModal(ok, title, body) {
    var modal = document.getElementById("checkModal");
    modal.classList.toggle("ok", ok);
    modal.classList.toggle("err", !ok);
    document.getElementById("checkTitle").innerHTML = ok
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>连接成功'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>连接失败';
    document.getElementById("checkBody").textContent = body;
    checkMask.hidden = false;
  }
  checkBtn.addEventListener("click", function () {
    var api = getAPI();
    checkBtn.disabled = true;
    checkBtn.textContent = "验证中…";
    var done = function () { checkBtn.disabled = false; checkBtn.textContent = "验证"; };
    fetch(api + "/api/plugins", { method: "GET" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          showCheckModal(true, "", "已成功连接到服务器，「" + api + "」地址没有问题，可以登录使用。");
        } else {
          showCheckModal(false, "", "服务器响应异常：请确认「" + api + "」是 MagicHub 服务器。");
        }
      })
      .catch(function () {
        showCheckModal(false, "", "无法连接到服务器「" + api + "」：请检查地址是否正确、服务器是否已启动。");
      })
      .finally(function () { done(); });
  });
  checkClose.addEventListener("click", function () { checkMask.hidden = true; });
  checkMask.addEventListener("click", function (e) { if (e.target === checkMask) checkMask.hidden = true; });
})();
</script>
</body>
</html>
