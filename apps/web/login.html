<!DOCTYPE html>
<!-- magichub-live-update-mark-v2 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub · 登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- 窗口标题栏：桌面壳下可拖动窗口 + 最小化/最大化/关闭 -->
<header class="titlebar login-titlebar">
  <span class="title">MagicHub · 登录</span>
  <div class="win-controls" aria-label="窗口控制">
    <button id="winMin" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="winMax" title="最大化/还原"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<div class="auth-page">
  <div class="auth-layout">

    <!-- 左侧品牌展示区 -->
    <section class="auth-brand">
      <div class="brand-logo"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#A78BFA"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#17171A"/></svg></div>
      <h1 class="brand-title">MagicHub</h1>
      <p class="brand-slogan">轻量 · 实时 · 可扩展的桌面聊天工作台</p>
      <ul class="brand-feats">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg><span>实时消息与文件传输，多端同步</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>插件系统，能力按需扩展</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>内置服务器，开箱即用</span></li>
      </ul>
      <div class="brand-foot">MagicHub v0.4.0 · 深紫星云版</div>
      <div class="brand-server">
        <label for="server">服务器地址</label>
        <div class="server-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <input class="input" id="server" name="server" autocomplete="off" spellcheck="false"
                 placeholder="http://localhost:3000">
          <button type="button" class="server-check" id="serverCheck">验证</button>
        </div>
        <div class="server-tip">默认连接本机；连其他机器时填服务器 IP，如 http://192.168.1.100:3000</div>
      </div>
    </section>

    <!-- 右侧登录 / 注册卡片 -->
    <section class="auth-card-col">
      <div class="auth-card wide" id="authCard">
        <h2 class="card-title">欢迎回来</h2>
        <p class="card-sub">登录或注册，开始你的轻量聊天</p>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tabLogin" type="button">登录</button>
      <button class="tab" id="tabRegister" type="button">注册</button>
    </div>

    <form id="authForm" novalidate>
      <div class="field" style="margin-top:18px">
        <label for="username">账号</label>
        <input class="input" id="username" name="username" autocomplete="username"
               placeholder="3-24 位字母、数字或下划线" maxlength="24">
      </div>

      <!-- 注册专属字段 -->
      <div class="reg-field field">
        <label for="displayName">名字</label>
        <input class="input" id="displayName" name="displayName" autocomplete="nickname"
               placeholder="怎么称呼你（1-32 个字符）" maxlength="32">
      </div>
      <div class="reg-field field">
        <label>头像</label>
        <div class="reg-row">
          <label class="avatar-pick" id="avatarPick" for="avatarInput" title="点击上传头像">
            <span class="ph" id="avatarPh">＋</span>
            <img id="avatarImg" alt="头像预览">
            <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp">
          </label>
          <span class="avatar-tip">选一张图片作头像（自动裁剪为方形圆角并压缩，保存到服务器）</span>
        </div>
      </div>

      <!-- 注册算术验证码（防脚本滥注册，服务端出题一次性） -->
      <div class="reg-field field">
        <label for="captcha">验证码</label>
        <div class="reg-row captcha-row">
          <span class="captcha-q" id="captchaQ">请切换到注册后加载</span>
          <input class="input captcha-input" id="captcha" name="captcha" autocomplete="off"
                 placeholder="计算结果" maxlength="3" inputmode="numeric">
          <button type="button" class="server-check" id="captchaRefresh" title="换一题">换一题</button>
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password"
               placeholder="至少 6 位" maxlength="64">
      </div>

      <div class="last-login" id="lastLogin" hidden>上次登录：<b id="lastLoginName"></b>，请输入密码登录</div>
      <div class="auth-error" id="authError"></div>
      <button class="btn btn-primary" id="submitBtn" type="submit">登 录</button>
    </form>

    <p class="auth-switch" id="switchHint">
      还没有账号？<button type="button" id="switchBtn">去注册</button>
    </p>
      </div>
    </section>
  </div>
</div>

<!-- 服务器验证结果弹窗 -->
<div class="check-modal-mask" id="checkMask" hidden>
  <div class="check-modal" id="checkModal">
    <div class="check-title" id="checkTitle"></div>
    <div class="check-body" id="checkBody"></div>
    <button class="check-close" id="checkClose" type="button">知道了</button>
  </div>
</div>

<script src="js/pages/login.js"></script>
</body>
</html>
