<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub · WebSocket 连通演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/chat.css">
<style>
  body{height:100vh;display:flex;flex-direction:column}
  .msg-area{flex:1;min-height:0}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="logo-badge"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#fff"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#fff"/></svg></span>MagicHub</div>
  <span id="userChip" class="tag" style="display:none"></span>
  <div class="status" id="status"><i></i><span id="statusText">未连接</span></div>
</header>

<div class="msg-area" id="msgArea">
  <div class="empty" id="emptyTip">
    <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
    <span>启动后端后本页会自动连接（<b style="color:var(--text-2)">apps/server · npm start</b>）<br>输入任意文字并发送，广播消息会原样回显</span>
  </div>
</div>

<div class="input-bar">
  <input class="input" id="input" placeholder="输入消息…" maxlength="500" disabled>
  <button class="send" id="sendBtn" disabled>发送</button>
</div>

<div class="note-bar">WebSocket 地址：<code id="wsUrl">ws://localhost:3000</code> · 断线后每 3 秒自动重连</div>

<script>
(function () {
  const WS_URL = "ws://localhost:3000";
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const msgArea = document.getElementById("msgArea");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const emptyTip = document.getElementById("emptyTip");
  document.getElementById("wsUrl").textContent = WS_URL;

  // 当前登录用户（登录页写入 localStorage）
  const user = localStorage.getItem("magichub_user");
  const userChip = document.getElementById("userChip");
  if (user) {
    userChip.style.display = "inline-flex";
    userChip.textContent = "@" + user;
    userChip.title = "点击退出登录";
    userChip.style.cursor = "pointer";
    userChip.addEventListener("click", function () {
      localStorage.removeItem("magichub_user");
      location.href = "login.html";
    });
  }

  let ws = null;
  let retryTimer = null;

  function setStatus(state, text) {
    statusEl.classList.remove("on", "err");
    if (state === "on") statusEl.classList.add("on");
    if (state === "err") statusEl.classList.add("err");
    statusText.textContent = text;
  }

  function addSystem(text) {
    emptyTip.style.display = "none";
    const div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function addMessage(text, mine) {
    emptyTip.style.display = "none";
    const div = document.createElement("div");
    div.className = "msg " + (mine ? "out" : "in");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function connect() {
    clearTimeout(retryTimer);
    setStatus("", "连接中…");
    ws = new WebSocket(WS_URL);

    ws.onopen = function () {
      setStatus("on", "已连接");
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      addSystem("已连接到 MagicHub 服务，等待 hello…");
    };

    ws.onmessage = function (ev) {
      let frame;
      try { frame = JSON.parse(ev.data); } catch { return; }
      if (frame.type === "hello") {
        addSystem("服务端握手成功：" + (frame.msg || ""));
      } else if (frame.type === "broadcast") {
        addMessage(String(frame.text), false);
      }
    };

    ws.onclose = function () {
      setStatus("err", "已断开 · 3 秒后重连");
      input.disabled = true;
      sendBtn.disabled = true;
      retryTimer = setTimeout(connect, 3000);
    };

    ws.onerror = function () {
      // onclose 会随后触发，由它统一处理重连
    };
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage(text, true);
    ws.send(text);
    input.value = "";
    input.focus();
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
  });

  connect();
})();
</script>
</body>
</html>
