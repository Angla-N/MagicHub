<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub 主界面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- ===== 窗口标题栏 ===== -->
<header class="titlebar">
  <div class="logo"><span class="logo-badge"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#fff"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#fff"/></svg></span>MagicHub</div>
  <span class="title" id="viewTitle">会话</span>
  <div class="win-controls" aria-label="窗口控制">
    <button id="winMin" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="winMax" title="最大化/还原"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<div class="app-shell" id="appShell">
  <!-- ===== 左侧导航栏 ===== -->
  <nav class="rail" aria-label="主导航">
    <button class="rail-avatar" id="avatarBtn" title="账号"></button>

    <button class="rail-item on" data-view="chat" title="会话"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.077 3C7.149 3 3 6.96 3 11.843V21l9.075-.01c4.928 0 8.925-4.11 8.925-8.993C21 7.113 17 3 12.077 3m3.92 12.859a5.57 5.57 0 0 1-6.102 1.043l-3.595.805 1.001-3.192a5.44 5.44 0 0 1 .11-5.415 5.55 5.55 0 0 1 4.753-2.678h.006a5.53 5.53 0 0 1 5.131 3.438 5.44 5.44 0 0 1-1.304 5.998"/></svg></button>
    <button class="rail-item" data-view="contacts" title="通讯录"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 2.6-5 5.5-5s4.9 1.6 5.5 5M16 5.6a3 3 0 0 1 0 5.4M17.6 14.4c1.6.8 2.5 2.2 2.9 4.1"/></svg></button>

    <span class="rail-sep"></span>

    <!-- 插件区：由本地已装插件动态渲染 -->
    <div class="rail-plugins" id="pluginRail"></div>
    <span class="rail-sep" id="pluginSep" hidden></span>

    <button class="rail-item" data-view="market" title="插件市场"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 8l1.2-4h13.6L20 8M4 8v12h16V8M10 12h4"/></svg></button>
    <button class="rail-item" data-view="settings" title="设置"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.3 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.3 2.6h4l.3-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
  </nav>

  <!-- ===== 内容区：会话栏（仅聊天视图）+ 主视图 ===== -->
  <div class="app-main">

  <!-- ===== 会话列表（仅聊天视图显示，好友会话） ===== -->
  <aside class="list-pane">
    <div class="list-head">
      <h3>会话</h3>
      <div class="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="convSearch" placeholder="搜索会话或消息">
        <button class="icon-btn gsearch-btn" id="globalSearchBtn" title="全局搜索消息"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/><path d="M8.5 11h5M11 8.5v5"/></svg></button>
      </div>
    </div>
    <div class="list" id="chatList"></div>
  </aside>

  <!-- ===== 主视图区 ===== -->
  <main class="chat-pane">

    <!-- 聊天视图 -->
    <div class="chat-view" id="chatView" style="display:flex;flex-direction:column;min-width:0;min-height:0;flex:1">
      <div class="chat-head" id="chatHead" style="display:none">
        <button class="peer-btn" id="peerBtn" title="查看好友资料">
          <span class="p-av" id="peerAv"></span>
          <span class="dot"></span>
          <h4 id="chatName"></h4>
        </button>
        <div class="tools">
          <button class="icon-btn" id="msgSearchBtn" title="搜索消息"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
          <button class="icon-btn" title="更多"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div class="status" id="status"><i></i><span id="statusText">未连接</span></div>
      </div>
      <div class="msg-search" id="msgSearch">
        <input id="msgSearchInput" placeholder="搜索当前会话的消息…">
        <span class="m-count" id="msgSearchCount"></span>
        <button class="icon-btn" id="msgSearchClose" title="关闭搜索"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="msg-area" id="msgArea">
        <div class="empty" id="emptyTip">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
          <span id="emptyText">还没有好友会话<br>去「通讯录」添加好友后即可聊天</span>
        </div>
      </div>
      <!-- P2：#27 对方正在输入提示（输入栏上方） -->
      <div class="typing-hint" id="typingHint" hidden></div>
      <div class="input-bar" id="inputBar" style="display:none">
        <div class="input-tools">
          <button class="attach-btn" id="attachBtn" title="发送图片或文件"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="attach-pop" id="attachPop">
            <button id="pickImage"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5.2-5 3.3 3L17 13l4 3"/></svg>发送图片</button>
            <button id="pickFile"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></svg>发送文件</button>
          </div>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <input type="file" id="fileInput" hidden>
        </div>
        <textarea id="input" placeholder="输入消息，Enter 发送" disabled></textarea>
        <button class="send" id="sendBtn" disabled>发送</button>
      </div>
    </div>

    <!-- 通讯录视图（所有用户，只能查看/加好友，不能发消息） -->
    <div class="contacts-view" id="contactsView">
      <div class="contacts-head">通讯录 · 所有用户</div>
      <div class="contacts-body">
        <div class="c-list" id="userList"></div>
        <div class="c-detail" id="userDetail">
          <div class="d-tip">选择左侧用户查看资料<br>添加好友后即可在「会话」中聊天</div>
        </div>
      </div>
    </div>

    <!-- 插件视图（占满聊天区） -->
    <div class="plugin-view" id="pluginView" style="display:none">
      <div class="plugin-head">
        <span class="dot"></span>
        <h4 id="pluginTitle">插件</h4>
        <div class="tools"><button class="icon-btn" id="pluginClose" title="关闭插件"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      </div>
      <iframe class="plugin-frame" id="pluginFrame" title="插件内容" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <!-- 设置视图 -->
    <div class="settings-view" id="settingsView">
      <div class="settings-head">设置</div>
      <div class="settings-body">
        <div class="set-card">
          <h4 class="set-card-title">账号信息</h4>
          <div class="set-row"><span class="set-label">头像</span>
            <span class="set-avatar" id="setAvatarWrap"></span>
            <button class="set-btn" id="setAvatarBtn">更换头像</button>
            <input type="file" id="setAvatarInput" accept="image/*" hidden>
          </div>
          <div class="set-row"><span class="set-label">名字</span>
            <input class="input" id="setNameInput" maxlength="32" placeholder="输入新的名字" style="flex:1;min-width:120px">
            <button class="set-btn primary" id="setProfileSave">保存资料</button>
          </div>
          <div class="set-row"><span class="set-label">账号</span><span class="set-val mono" id="setUsername"></span></div>
          <div class="set-row"><span class="set-label">密码</span><span class="set-val mono" id="setPassword">••••••••</span>
            <button class="set-btn" id="setPwdBtn">修改密码</button></div>
          <div class="set-row"><span class="set-label">服务器地址</span><span class="set-val mono" id="setServer"></span></div>
        </div>
        <div class="set-card">
          <h4 class="set-card-title">通用</h4>
          <div class="set-row" id="keepRow">
            <span class="set-label">后台驻留</span>
            <span class="set-val">关闭窗口时最小化到系统托盘（快速启动）</span>
            <label class="switch" id="keepSwitch"><input type="checkbox" id="keepCheck"><span class="slider"></span></label>
          </div>
        </div>
        <div class="set-card">
          <h4 class="set-card-title">服务器存储占用</h4>
          <div class="set-row"><span class="set-label">总占用</span><span class="set-val mono" id="stTotal">-</span></div>
          <div class="set-row"><span class="set-label">聊天记录</span><span class="set-val mono" id="stChat">-</span></div>
          <div class="set-row"><span class="set-label">上传文件</span><span class="set-val mono" id="stUploads">-</span></div>
          <div class="set-row"><span class="set-label">头像</span><span class="set-val mono" id="stAvatars">-</span></div>
          <div class="set-row"><span class="set-label">插件</span><span class="set-val mono" id="stPlugins">-</span></div>
        </div>
        <div class="set-card">
          <h4 class="set-card-title">已启用插件</h4>
          <div class="set-plugins" id="setPlugins"></div>
        </div>
      </div>
    </div>

    <!-- 插件市场视图 -->
    <div class="market-view" id="marketView">
      <div class="market-head">
        <h4>插件市场</h4>
        <div class="tools">
          <button class="icon-btn" id="pluginUploadBtn" title="上传 .7z 插件包"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 15v5h16v-5"/></svg></button>
        </div>
      </div>
      <div class="market-stats">
        <div class="mstat"><b id="mstatMine">0</b><span>我发布的</span></div>
        <div class="mstat"><b id="mstatInstalled">0</b><span>已下载</span></div>
        <div class="mstat"><b id="mstatAll">0</b><span>市场总数</span></div>
        <div class="mstat-tabs">
          <button class="mstat-tab on" data-tab="all" id="mktTabAll">全部</button>
          <button class="mstat-tab" data-tab="mine" id="mktTabMine">我的</button>
        </div>
      </div>
      <div class="market-body" id="marketBody"></div>
      <input type="file" id="pluginPackInput" accept=".7z" hidden>
    </div>
  </main>
  </div><!-- /app-main -->
</div>

<!-- 修改密码弹窗 -->
<div class="modal-mask" id="pwdMask" hidden>
  <div class="card-modal" style="width:320px">
    <div class="card-name" style="margin-bottom:14px">修改密码</div>
    <div class="pwd-field">
      <label for="pwdOld">原密码</label>
      <input class="input" id="pwdOld" type="password" autocomplete="current-password" placeholder="输入原密码" maxlength="64">
    </div>
    <div class="pwd-field">
      <label for="pwdNew">新密码</label>
      <input class="input" id="pwdNew" type="password" autocomplete="new-password" placeholder="至少 6 位" maxlength="64">
    </div>
    <div class="pwd-field">
      <label for="pwdNew2">确认新密码</label>
      <input class="input" id="pwdNew2" type="password" autocomplete="new-password" placeholder="再次输入新密码" maxlength="64">
    </div>
    <div class="pwd-err" id="pwdErr"></div>
    <div class="card-actions" style="width:100%;justify-content:flex-end">
      <button class="add-btn" id="pwdCancel" style="background:var(--surface);color:var(--text-2);border:1px solid var(--border)">取消</button>
      <button class="add-btn" id="pwdSave" style="background:var(--grad);color:#fff">保存</button>
    </div>
  </div>
</div>

<!-- 全局消息搜索弹窗（跨所有会话） -->
<div class="modal-mask" id="globalSearchMask" hidden>
  <div class="card-modal gsearch-modal">
    <div class="card-name" style="margin-bottom:12px">全局消息搜索</div>
    <div class="gsearch-input-wrap">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input class="input" id="globalSearchInput" placeholder="搜索我所有会话中的消息…" maxlength="64">
    </div>
    <div class="gsearch-results" id="globalSearchResults"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<!-- 图片查看灯箱 -->
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<!-- 好友资料卡弹窗 -->
<div class="modal-mask" id="cardMask" hidden>
  <div class="card-modal">
    <div class="card-avatar" id="cardAvatar"></div>
    <div class="card-name" id="cardName"></div>
    <div class="card-acc" id="cardAcc"></div>
    <div class="card-tag">已是好友</div>
    <div class="card-actions">
      <button class="add-btn" id="cardMsgBtn">发消息</button>
      <button class="add-btn" id="cardClose" style="background:var(--surface);color:var(--text-2);border:1px solid var(--border)">关闭</button>
    </div>
  </div>
</div>

<!-- 我的资料弹窗（点击导航栏头像弹出，可放大查看，退出登录需点按钮） -->
<div class="modal-mask" id="myMask" hidden>
  <div class="card-modal">
    <div class="card-avatar" id="myCardAvatar"></div>
    <div class="card-name" id="myCardName"></div>
    <div class="card-acc" id="myCardAcc"></div>
    <div class="card-tag">我的账号</div>
    <div class="card-actions">
      <button class="add-btn" id="myClose" style="background:var(--surface);color:var(--text-2);border:1px solid var(--border)">关闭</button>
      <button class="add-btn" id="myLogout" style="background:rgba(244,63,94,.16);color:#fb7185;border:1px solid rgba(244,63,94,.4)">退出登录</button>
    </div>
  </div>
</div>

<!-- ===== 脚本：核心（配置/会话/工具/请求/提示） ===== -->
<script src="js/core/config.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/toast.js"></script>

<!-- ===== 脚本：通用组件（窗口栏/灯箱/资料卡/弹窗/搜索） ===== -->
<script src="js/components/window-bar.js"></script>
<script src="js/components/lightbox.js"></script>
<script src="js/components/my-profile.js"></script>
<script src="js/components/password-dialog.js"></script>
<script src="js/components/peer-card.js"></script>
<script src="js/components/global-search.js"></script>
<script src="js/components/message-search.js"></script>

<!-- ===== 脚本：业务功能（外壳/插件/市场/设置/会话/消息/输入/在线/通讯录/实时） ===== -->
<script src="js/features/shell.js"></script>
<script src="js/features/plugin-store.js"></script>
<script src="js/features/market-view.js"></script>
<script src="js/features/settings-view.js"></script>
<script src="js/features/message-cache.js"></script>
<script src="js/features/messages.js"></script>
<script src="js/features/conversations.js"></script>
<script src="js/features/composer.js"></script>
<script src="js/features/presence.js"></script>
<script src="js/features/contacts-view.js"></script>
<script src="js/features/realtime.js"></script>

<!-- ===== 脚本：应用启动装配 ===== -->
<script src="js/app.js"></script>
</body>
</html>
