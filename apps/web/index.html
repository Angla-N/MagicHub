<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub 主界面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/chat.css">
<style>
  /* —— 页面专属：窗口化主界面布局 —— */
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .app-shell{height:calc(100vh - 46px);border-radius:0;border:none;box-shadow:none}

  /* 头像：方形圆角（非圆形） */
  .rail-avatar{width:38px;height:38px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;
    margin-bottom:14px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(124,58,237,.45);overflow:hidden}
  .rail-avatar img{width:100%;height:100%;object-fit:cover}
  .rail-plugins{display:flex;flex-direction:column;align-items:center;gap:6px}
  .rail-plugins .rail-item img{width:20px;height:20px;border-radius:5px}

  /* 会话列表：仅聊天视图显示；其余视图内容占满整个主区域 */
  body:not(.chat-mode) .list-pane{display:none!important}
  @media(min-width:820px){body.chat-mode .list-pane{display:flex}}
  @media(max-width:819px){.list-pane{display:none!important}}

  /* 插件视图：占满聊天区剩余空间 */
  .plugin-view{display:flex;flex-direction:column;min-width:0;background:var(--bg-soft);flex:1}
  .plugin-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .plugin-head h4{font-size:14px;font-weight:700}
  .plugin-frame{flex:1;min-height:0;border:none;background:var(--bg)}

  /* 占位视图（设置 演示） */
  .ph-view{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-3);font-size:13px;min-width:0;flex:1}
  .ph-view svg{opacity:.6}

  /* —— 设置视图：账号信息 + 已启用插件 —— */
  .settings-view{display:none;flex-direction:column;min-width:0;background:var(--bg-soft);flex:1}
  .settings-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;flex:none}
  .settings-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
  .set-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .set-card-title{font-size:13px;font-weight:800;color:var(--accent-soft);margin:0 0 12px;letter-spacing:.5px}
  .set-row{display:flex;align-items:center;gap:14px;padding:9px 0;font-size:13px;border-bottom:1px dashed var(--border)}
  .set-row:last-child{border-bottom:none}
  .set-label{flex:none;width:76px;color:var(--text-3)}
  .set-val{flex:1;color:var(--text-1);word-break:break-all}
  .set-val.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
  .set-btn{flex:none;padding:6px 14px;border-radius:9px;background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.45);
    color:var(--accent-soft);font-size:12px;cursor:pointer;transition:background .2s}
  .set-btn:hover{background:rgba(124,58,237,.3)}
  .set-plugins{display:flex;flex-direction:column;gap:10px}
  .set-plugin{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-soft);
    border:1px solid var(--border);border-radius:12px}
  .set-plugin img{width:26px;height:26px;border-radius:7px;flex:none}
  .set-plugin-letter{width:26px;height:26px;border-radius:7px;background:var(--grad);color:#fff;font-weight:800;
    font-size:13px;display:grid;place-items:center;flex:none}
  .set-plugin-meta{flex:1;min-width:0}
  .set-plugin-meta b{display:block;font-size:13px;color:var(--text-1)}
  .set-plugin-meta span{display:block;font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .set-plugin-on{flex:none;font-size:11px;color:#6ee7b7;background:rgba(52,211,153,.12);
    border:1px solid rgba(52,211,153,.3);border-radius:999px;padding:3px 10px}
  .set-empty{font-size:12px;color:var(--text-3);padding:8px 0}
  .pwd-field{margin-bottom:12px;width:100%}
  .pwd-field label{display:block;font-size:11px;color:var(--text-3);margin-bottom:6px}
  .pwd-field .input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg-soft);color:var(--text-1);font-size:13px;box-sizing:border-box}
  .pwd-field .input:focus{outline:none;border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
  .pwd-err{width:100%;min-height:18px;font-size:12px;color:#fb7185;margin-bottom:6px}
  /* 开关（后台驻留） */
  .switch{position:relative;display:inline-block;width:40px;height:22px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch .slider{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;transition:.2s}
  .switch .slider:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;left:2px;top:2px;
    background:#9ca3af;transition:.2s}
  .switch input:checked + .slider{background:rgba(124,58,237,.35);border-color:rgba(167,139,250,.6)}
  .switch input:checked + .slider:before{transform:translateX(18px);background:var(--grad)}

  /* —— 插件市场视图 —— */
  .market-view{display:none;flex-direction:column;min-width:0;background:var(--bg-soft);flex:1}
  .market-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;flex:none;
    display:flex;align-items:center}
  .market-head .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
  .market-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
  .market-empty{color:var(--text-3);font-size:13px;text-align:center;padding:48px 0}
  .mkt-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:14px 16px;transition:border-color .2s}
  .mkt-card:hover{border-color:rgba(167,139,250,.4)}
  .mkt-icon{width:44px;height:44px;border-radius:11px;background:var(--grad);color:#fff;font-weight:800;font-size:18px;
    display:grid;place-items:center;flex:none;overflow:hidden}
  .mkt-icon img{width:100%;height:100%;object-fit:cover}
  .mkt-info{flex:1;min-width:0}
  .mkt-info b{display:block;font-size:14px;color:var(--text-1)}
  .mkt-info .mkt-meta{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mkt-info .mkt-desc{font-size:12px;color:var(--text-2);margin-top:4px;line-height:1.5;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mkt-actions{flex:none;display:flex;gap:8px;align-items:center}
  .mkt-btn{padding:6px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    color:var(--text-1);font-size:12px;cursor:pointer;transition:.18s;white-space:nowrap}
  .mkt-btn:hover{background:rgba(124,58,237,.2);border-color:rgba(167,139,250,.5);color:var(--accent-soft)}
  .mkt-btn.primary{background:var(--grad);border:none;color:#fff}
  .mkt-btn.primary:hover{filter:brightness(1.12)}
  .mkt-btn.danger{color:#fb7185;border-color:rgba(244,63,94,.4)}
  .mkt-btn.danger:hover{background:rgba(244,63,94,.15)}
  .mkt-btn:disabled{opacity:.45;cursor:default}
  .mkt-badge{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .mkt-badge.pub{color:#6ee7b7;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3)}
  .mkt-badge.priv{color:var(--text-3);background:rgba(255,255,255,.05);border:1px solid var(--border)}
  .mkt-badge.inst{color:var(--accent-soft);background:rgba(124,58,237,.14);border:1px solid rgba(167,139,250,.4)}

  /* —— 通讯录视图（所有用户，只能查看与加好友，不能发消息） —— */
  .contacts-view{display:none;flex-direction:column;min-width:0;background:var(--bg-soft);flex:1}
  .contacts-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;flex:none}
  .contacts-body{flex:1;display:flex;min-height:0}
  .c-list{flex:none;width:264px;border-right:1px solid var(--border);overflow:auto;padding:8px}
  @media(max-width:760px){.c-list{width:100%}}
  .c-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;transition:.18s;cursor:pointer}
  .c-item:hover,.c-item.on{background:var(--surface-2)}
  .c-item .ci-main{flex:1;min-width:0}
  .c-item .ci-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-item .ci-acc{font-size:11px;color:var(--text-3)}
  .add-btn{flex:none;font-size:11px;font-weight:600;color:#fff;background:var(--grad);border:none;border-radius:8px;padding:6px 12px;cursor:pointer;transition:.18s}
  .add-btn:hover{filter:brightness(1.12)}
  .add-btn.added{background:transparent;color:var(--text-3);border:1px solid var(--border);cursor:default}
  .c-detail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-2);font-size:13px;min-width:0;padding:24px}
  .c-detail .big-avatar{width:96px;height:96px;border-radius:24px;background:var(--grad);color:#fff;font-size:36px;font-weight:800;display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 30px rgba(124,58,237,.4)}
  .c-detail .big-avatar img{width:100%;height:100%;object-fit:cover}
  .c-detail .d-name{font-size:18px;font-weight:700;color:var(--text)}
  .c-detail .d-tip{font-size:11px;color:var(--text-3)}
</style>
</head>
<body>

<!-- ===== 窗口标题栏 ===== -->
<header class="titlebar">
  <div class="logo"><span class="logo-badge"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#fff"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#fff"/></svg></span>MagicHub</div>
  <span class="title" id="viewTitle">会话</span>
  <div class="win-controls" aria-label="窗口控制">
    <button id="winMin" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="winMax" title="最大化/还原"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<div class="app-shell" id="appShell">
  <!-- ===== 左侧导航栏 ===== -->
  <nav class="rail" aria-label="主导航">
    <button class="rail-avatar" id="avatarBtn" title="账号"></button>

    <button class="rail-item on" data-view="chat" title="会话"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.077 3C7.149 3 3 6.96 3 11.843V21l9.075-.01c4.928 0 8.925-4.11 8.925-8.993C21 7.113 17 3 12.077 3m3.92 12.859a5.57 5.57 0 0 1-6.102 1.043l-3.595.805 1.001-3.192a5.44 5.44 0 0 1 .11-5.415 5.55 5.55 0 0 1 4.753-2.678h.006a5.53 5.53 0 0 1 5.131 3.438 5.44 5.44 0 0 1-1.304 5.998"/></svg></button>
    <button class="rail-item" data-view="contacts" title="通讯录"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 2.6-5 5.5-5s4.9 1.6 5.5 5M16 5.6a3 3 0 0 1 0 5.4M17.6 14.4c1.6.8 2.5 2.2 2.9 4.1"/></svg></button>

    <span class="rail-sep"></span>

    <!-- 插件区：由本地已装插件动态渲染 -->
    <div class="rail-plugins" id="pluginRail"></div>
    <span class="rail-sep" id="pluginSep" hidden></span>

    <button class="rail-item" data-view="market" title="插件市场"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16M4 8l1.2-4h13.6L20 8M4 8v12h16V8M10 12h4"/></svg></button>
    <button class="rail-item" data-view="settings" title="设置"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.3 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.3 2.6h4l.3-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
  </nav>

  <!-- ===== 内容区：会话栏（仅聊天视图）+ 主视图 ===== -->
  <div class="app-main">

  <!-- ===== 会话列表（仅聊天视图显示，好友会话） ===== -->
  <aside class="list-pane">
    <div class="list-head">
      <h3>会话</h3>
      <div class="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="convSearch" placeholder="搜索会话或消息"></div>
    </div>
    <div class="list" id="chatList"></div>
  </aside>

  <!-- ===== 主视图区 ===== -->
  <main class="chat-pane">

    <!-- 聊天视图 -->
    <div class="chat-view" id="chatView" style="display:flex;flex-direction:column;min-width:0;min-height:0;flex:1">
      <div class="chat-head" id="chatHead" style="display:none">
        <button class="peer-btn" id="peerBtn" title="查看好友资料">
          <span class="p-av" id="peerAv"></span>
          <span class="dot"></span>
          <h4 id="chatName"></h4>
        </button>
        <div class="tools">
          <button class="icon-btn" id="msgSearchBtn" title="搜索消息"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
          <button class="icon-btn" title="更多"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div class="status" id="status"><i></i><span id="statusText">未连接</span></div>
      </div>
      <div class="msg-search" id="msgSearch">
        <input id="msgSearchInput" placeholder="搜索当前会话的消息…">
        <span class="m-count" id="msgSearchCount"></span>
        <button class="icon-btn" id="msgSearchClose" title="关闭搜索"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="msg-area" id="msgArea">
        <div class="empty" id="emptyTip">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
          <span id="emptyText">还没有好友会话<br>去「通讯录」添加好友后即可聊天</span>
        </div>
      </div>
      <div class="input-bar" id="inputBar" style="display:none">
        <div class="input-tools">
          <button class="attach-btn" id="attachBtn" title="发送图片或文件"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="attach-pop" id="attachPop">
            <button id="pickImage"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m5 18 5.2-5 3.3 3L17 13l4 3"/></svg>发送图片</button>
            <button id="pickFile"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></svg>发送文件</button>
          </div>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <input type="file" id="fileInput" hidden>
        </div>
        <textarea id="input" placeholder="输入消息，Enter 发送" disabled></textarea>
        <button class="send" id="sendBtn" disabled>发送</button>
      </div>
    </div>

    <!-- 通讯录视图（所有用户，只能查看/加好友，不能发消息） -->
    <div class="contacts-view" id="contactsView">
      <div class="contacts-head">通讯录 · 所有用户</div>
      <div class="contacts-body">
        <div class="c-list" id="userList"></div>
        <div class="c-detail" id="userDetail">
          <div class="d-tip">选择左侧用户查看资料<br>添加好友后即可在「会话」中聊天</div>
        </div>
      </div>
    </div>

    <!-- 插件视图（占满聊天区） -->
    <div class="plugin-view" id="pluginView" style="display:none">
      <div class="plugin-head">
        <span class="dot"></span>
        <h4 id="pluginTitle">插件</h4>
        <div class="tools"><button class="icon-btn" id="pluginClose" title="关闭插件"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      </div>
      <iframe class="plugin-frame" id="pluginFrame" title="插件内容" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <!-- 设置视图 -->
    <div class="settings-view" id="settingsView">
      <div class="settings-head">设置</div>
      <div class="settings-body">
        <div class="set-card">
          <h4 class="set-card-title">账号信息</h4>
          <div class="set-row"><span class="set-label">名字</span><span class="set-val" id="setName"></span></div>
          <div class="set-row"><span class="set-label">账号</span><span class="set-val mono" id="setUsername"></span></div>
          <div class="set-row"><span class="set-label">密码</span><span class="set-val mono" id="setPassword">••••••••</span>
            <button class="set-btn" id="setPwdBtn">修改密码</button></div>
          <div class="set-row"><span class="set-label">服务器地址</span><span class="set-val mono" id="setServer"></span></div>
        </div>
        <div class="set-card">
          <h4 class="set-card-title">通用</h4>
          <div class="set-row" id="keepRow">
            <span class="set-label">后台驻留</span>
            <span class="set-val">关闭窗口时最小化到系统托盘（快速启动）</span>
            <label class="switch" id="keepSwitch"><input type="checkbox" id="keepCheck"><span class="slider"></span></label>
          </div>
        </div>
        <div class="set-card">
          <h4 class="set-card-title">已启用插件</h4>
          <div class="set-plugins" id="setPlugins"></div>
        </div>
      </div>
    </div>

    <!-- 插件市场视图 -->
    <div class="market-view" id="marketView">
      <div class="market-head">
        <h4>插件市场</h4>
        <div class="tools">
          <button class="icon-btn" id="pluginUploadBtn" title="上传 .7z 插件包"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 15v5h16v-5"/></svg></button>
        </div>
      </div>
      <div class="market-body" id="marketBody"></div>
      <input type="file" id="pluginPackInput" accept=".7z" hidden>
    </div>
  </main>
  </div><!-- /app-main -->
</div>

      <label for="pwdNew2">确认新密码</label>

  <div class="card-modal">

<!-- 我的资料弹窗（点击导航栏头像弹出，可放大查看，退出登录需点按钮） -->
<div class="modal-mask" id="myMask" hidden>
  <div class="card-modal">
    <div class="card-avatar" id="myCardAvatar"></div>
    <div class="card-name" id="myCardName"></div>
    <div class="card-acc" id="myCardAcc"></div>
    <div class="card-tag">我的账号</div>
    <div class="card-actions">
      <button class="add-btn" id="myClose" style="background:var(--surface);color:var(--text-2);border:1px solid var(--border)">关闭</button>
      <button class="add-btn" id="myLogout" style="background:rgba(244,63,94,.16);color:#fb7185;border:1px solid rgba(244,63,94,.4)">退出登录</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== 登录门禁：必须真实登录后才能进入主界面 ===== */
  var sessionStr = localStorage.getItem("magichub_session");
  if (!sessionStr) { location.replace("login.html"); return; }
  var session;
  try { session = JSON.parse(sessionStr); } catch (e) { session = null; }
  if (!session || !session.username) {
    localStorage.removeItem("magichub_session");
    location.replace("login.html");
    return;
  }

  /* ===== 服务地址：用户填写的服务器地址 > Electron 注入 > 本机默认 ===== */
  var BASE = session.serverBase
    || (window.magicHub && window.magicHub.serverBase)
    || "http://localhost:3000";
  var WS_URL = BASE.replace(/^http/, "ws") + "/";

  var $ = function (id) { return document.getElementById(id); };
  var toastEl = $("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  function authHeaders(json) {
    var h = { "Authorization": "Bearer " + session.token };
    if (json) h["Content-Type"] = "application/json";
    return h;
  }

  /* ===== 账号头像：点击放大查看，不直接退出登录 ===== */
  var avatarBtn = $("avatarBtn");
  function renderAvatar() {
    avatarBtn.innerHTML = "";
    if (session.avatar) {
      var img = document.createElement("img");
      img.src = BASE + session.avatar;
      img.alt = session.displayName || session.username;
      img.onerror = function () { img.remove(); avatarBtn.textContent = (session.displayName || session.username).charAt(0).toUpperCase(); };
      avatarBtn.appendChild(img);
    } else {
      avatarBtn.textContent = (session.displayName || session.username).charAt(0).toUpperCase();
    }
    avatarBtn.title = (session.displayName || session.username) + " · 点击查看我的资料";
  }
  renderAvatar();
  avatarBtn.addEventListener("click", function () {
    $("myCardAvatar").innerHTML = avatarHTML(session);
    $("myCardName").textContent = session.displayName || session.username;
    $("myCardAcc").textContent = "账号: " + session.username;
    $("myMask").hidden = false;
  });
  $("myClose").addEventListener("click", function () { $("myMask").hidden = true; });
  $("myMask").addEventListener("click", function (e) { if (e.target === this) this.hidden = true; });
  $("myLogout").addEventListener("click", function () {
    localStorage.removeItem("magichub_session");
    location.href = "login.html";
  });

  /* ===== 设置 · 修改密码 ===== */
  var pwdMask = $("pwdMask");
  $("setPwdBtn").addEventListener("click", function () {
    $("pwdOld").value = ""; $("pwdNew").value = ""; $("pwdNew2").value = "";
    $("pwdErr").textContent = "";
    pwdMask.hidden = false;
  });
  $("pwdCancel").addEventListener("click", function () { pwdMask.hidden = true; });
  pwdMask.addEventListener("click", function (e) { if (e.target === pwdMask) pwdMask.hidden = true; });
  $("pwdSave").addEventListener("click", function () {
    var oldP = $("pwdOld").value, newP = $("pwdNew").value, newP2 = $("pwdNew2").value;
    var errEl = $("pwdErr");
    if (!oldP) { errEl.textContent = "请输入原密码"; return; }
    if (newP.length < 6) { errEl.textContent = "新密码至少 6 位"; return; }
    if (newP !== newP2) { errEl.textContent = "两次输入的新密码不一致"; return; }
    var saveBtn = $("pwdSave");
    saveBtn.disabled = true;
    fetch(BASE + "/api/account/password", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.token },
      body: JSON.stringify({ oldPassword: oldP, newPassword: newP }),
    })
      .then(function (res) { return res.json(); })
      .then(function (d) {
        saveBtn.disabled = false;
        if (d.ok) {
          pwdMask.hidden = true;
          toast("密码修改成功");
        } else {
          errEl.textContent = (d.error && d.error.message) || "修改失败，请重试";
        }
      })
      .catch(function () {
        saveBtn.disabled = false;
        errEl.textContent = "无法连接服务器，请检查服务器地址";
      });
  });

  /* ===== 窗口控制 ===== */
  var native = window.magicHub || null;
  $("winMin").addEventListener("click", function () { native ? native.minimize() : toast("最小化（演示）"); });
  $("winMax").addEventListener("click", function () { native ? native.maximize() : toast("最大化（演示）"); });
  $("winClose").addEventListener("click", function () { native ? native.close() : toast("关闭（演示）"); });

  /* ===== 视图切换（会话 / 通讯录 / 设置 / 插件） ===== */
  var viewTitle = $("viewTitle");
  var chatView = $("chatView");
  var contactsView = $("contactsView");
  var pluginView = $("pluginView");
  var phView = $("settingsView");
  var railItems = Array.prototype.slice.call(document.querySelectorAll(".rail-item[data-view]"));
  var pluginEntries = {};

  function setListPane(show) { document.body.classList.toggle("chat-mode", !!show); }

  /* 未选会话时聊天界面全空：头像栏与输入栏都不显示，选中后才出现 */
  function setChatChrome(show) {
    $("chatHead").style.display = show ? "flex" : "none";
    $("inputBar").style.display = show ? "flex" : "none";
  }

  function hideAllViews() {
    chatView.style.display = "none";
    contactsView.style.display = "none";
    pluginView.style.display = "none";
    phView.style.display = "none";
    $("marketView").style.display = "none";
  }
  function showChat() {
    hideAllViews();
    chatView.style.display = "flex";
    viewTitle.textContent = "会话";
    setListPane(true);
    setChatChrome(!!activeConv);
    loadConvs();
    // 切回聊天视图时重新拉取当前会话消息（与后端保持一致）
    if (activeConv) openConv(activeConv);
  }
  function showContacts() {
    hideAllViews();
    contactsView.style.display = "flex";
    viewTitle.textContent = "通讯录";
    setListPane(false);
    loadUsers();
  }
  function showSettings() {
    hideAllViews();
    phView.style.display = "flex";
    viewTitle.textContent = "设置";
    setListPane(false);
    // 填充账号信息与服务器地址
    $("setName").textContent = session.displayName || session.username;
    $("setUsername").textContent = session.username;
    $("setServer").textContent = BASE;
    // 后台驻留开关（仅桌面端）
    var keepRow = $("keepRow");
    if (window.magicHub && window.magicHub.getKeepInBackground) {
      keepRow.style.display = "flex";
      window.magicHub.getKeepInBackground().then(function (v) { $("keepCheck").checked = !!v; });
    } else {
      keepRow.style.display = "none";
    }
    // 已启用插件列表（本地已装）
    var box = $("setPlugins");
    var list = localPlugins.length ? localPlugins : (window.magicHub ? [] : marketPlugins.filter(function (p) { return p.public !== false; }));
    if (!list.length) {
      box.innerHTML = '<div class="set-empty">暂无插件，去「插件市场」下载安装</div>';
      return;
    }
    box.innerHTML = "";
    list.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "set-plugin";
      var icon = pluginIconUrl(p);
      row.innerHTML = (icon ? '<img src="' + icon + '" alt="">' : '<span class="set-plugin-letter">' + p.name.charAt(0) + '</span>') +
        '<div class="set-plugin-meta"><b>' + p.name + '</b><span>' + (p.description || "MagicHub 插件") + '</span></div>' +
        '<span class="set-plugin-on">已启用</span>';
      box.appendChild(row);
    });
  }
  // 后台驻留开关变化时写入桌面端设置
  $("keepCheck").addEventListener("change", function () {
    if (window.magicHub && window.magicHub.setKeepInBackground) {
      window.magicHub.setKeepInBackground(this.checked).then(function () {
        toast(this.checked ? "已开启后台驻留：关闭窗口时最小化到托盘" : "已关闭后台驻留：关闭窗口将退出程序");
      }.bind(this));
    }
  });
  function showPlugin(id, meta) {
    hideAllViews();
    pluginView.style.display = "flex";
    viewTitle.textContent = meta.name;
    $("pluginTitle").textContent = meta.name;
    $("pluginFrame").src = meta.localEntry || (BASE + "/plugins/" + id + "/" + meta.entry);
    setListPane(false);
  }
  function showMarket() {
    hideAllViews();
    $("marketView").style.display = "flex";
    viewTitle.textContent = "插件市场";
    setListPane(false);
    renderMarket();
  }

  function clearRailActive() {
    railItems.forEach(function (x) { x.classList.remove("on"); });
    document.querySelectorAll("#pluginRail .rail-item").forEach(function (x) { x.classList.remove("on"); });
  }
  railItems.forEach(function (item) {
    item.addEventListener("click", function () {
      clearRailActive(); item.classList.add("on");
      var v = item.getAttribute("data-view");
      if (v === "chat") showChat();
      else if (v === "contacts") showContacts();
      else if (v === "market") showMarket();
      else if (v === "settings") showSettings();
    });
  });

  /* ===== 插件系统：本地已装优先加载，服务器市场可下载 ===== */
  function pluginIconUrl(p) {
    if (!p.icon) return null;
    if (/^(https?:)?\/\//.test(p.icon)) return p.icon;
    if (p.localEntry) return "file:///" + (p.localEntry.slice("file:///".length).split("/").slice(0, -1).join("/") + "/" + p.icon);
    return BASE + "/plugins/" + p.id + "/" + p.icon;
  }

  var localPlugins = []; // 桌面端：本地已安装插件
  var marketPlugins = []; // 服务器市场插件列表

  /** 渲染侧边栏插件区（本地已装插件） */
  function renderPluginRail() {
    var rail = $("pluginRail");
    rail.innerHTML = "";
    pluginEntries = {};
    var list = localPlugins.slice();
    // 浏览器模式（无桌面 IPC）：回退显示服务器公开插件
    if (!window.magicHub || !window.magicHub.listLocalPlugins) {
      list = marketPlugins.filter(function (p) { return p.public !== false; });
    }
    list.forEach(function (p) {
      pluginEntries[p.id] = p;
      var btn = document.createElement("button");
      btn.className = "rail-item";
      btn.title = p.name + "（插件）";
      var icon = pluginIconUrl(p);
      if (icon) {
        var img = document.createElement("img");
        img.src = icon; img.alt = "";
        btn.appendChild(img);
      } else {
        btn.textContent = p.name.charAt(0);
        btn.style.fontWeight = "800"; btn.style.fontSize = "14px"; btn.style.color = "var(--accent-soft)";
      }
      btn.addEventListener("click", function () {
        clearRailActive(); btn.classList.add("on");
        showPlugin(p.id, p);
      });
      rail.appendChild(btn);
    });
    $("pluginSep").hidden = list.length === 0;
  }

  function loadPlugins() {
    var localDone = false;
    function done() { if (localDone) { renderPluginRail(); openByHash(); } }

    // 桌面端：读取本地已装插件
    if (window.magicHub && window.magicHub.listLocalPlugins) {
      window.magicHub.listLocalPlugins()
        .then(function (list) {
          localPlugins = list || [];
          localDone = true; done();
        })
        .catch(function () { localDone = true; done(); });
    } else {
      localDone = true;
    }

    // 服务器市场列表
    fetch(BASE + "/api/plugins")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        marketPlugins = (data.ok && data.data && data.data.plugins) || [];
        localDone = true; done();
      })
      .catch(function () { /* 后端未启动 */ });
  }

  /* ===== 插件市场视图 ===== */
  function mktIcon(p) {
    var icon = pluginIconUrl(p);
    return icon ? '<img src="' + icon + '" alt="">' : p.name.charAt(0);
  }
  function installedLocalIds() {
    var s = {};
    localPlugins.forEach(function (p) { s[p.id] = p; });
    return s;
  }
  function renderMarket() {
    var box = $("marketBody");
    var local = installedLocalIds();
    if (!marketPlugins.length && !Object.keys(local).length) {
      box.innerHTML = '<div class="market-empty">市场为空：先用右上角「上传」按钮把 .7z 插件包发布到服务器</div>';
      return;
    }
    box.innerHTML = "";
    var shown = {};
    marketPlugins.forEach(function (p) { shown[p.id] = p; });
    localPlugins.forEach(function (p) { if (!shown[p.id]) shown[p.id] = p; });

    Object.keys(shown).forEach(function (id) {
      var p = shown[id];
      var lp = local[id];
      var isLocal = !!lp;
      var isOwner = p.isOwner;
      var card = document.createElement("div");
      card.className = "mkt-card";

      var actions = "";
      var badge = "";
      if (isLocal) {
        badge = '<span class="mkt-badge inst">已安装</span>';
        actions += '<button class="mkt-btn danger" data-act="uninstall" data-id="' + id + '">卸载</button>';
      } else {
        badge = p.public === false ? '<span class="mkt-badge priv">未公开</span>' : '<span class="mkt-badge pub">公开</span>';
        actions += '<button class="mkt-btn primary" data-act="install" data-id="' + id + '">下载安装</button>';
      }
      if (isOwner) {
        actions += '<button class="mkt-btn" data-act="toggle" data-id="' + id + '">' + (p.public === false ? "设为公开" : "设为私有") + "</button>";
        actions += '<button class="mkt-btn danger" data-act="delete" data-id="' + id + '">删除</button>';
      }

      card.innerHTML =
        '<div class="mkt-icon">' + mktIcon(p) + '</div>' +
        '<div class="mkt-info">' +
          '<b>' + p.name + ' <span style="color:var(--text-3);font-weight:600;font-size:11px">v' + p.version + '</span></b>' +
          '<div class="mkt-meta">作者：' + p.author + ' · ' + id + '</div>' +
          (p.description ? '<div class="mkt-desc">' + p.description + '</div>' : "") +
        '</div>' +
        '<div class="mkt-actions">' + badge + actions + '</div>';

      box.appendChild(card);
    });
  }

  function marketToast(msg) { toast(msg); }

  // 下载安装：拉 7z → 交给桌面端解压到本地
  function installPlugin(p) {
    if (!window.magicHub || !window.magicHub.installPlugin) {
      marketToast("请在桌面客户端中下载安装插件（浏览器模式仅支持浏览与上传）");
      return;
    }
    marketToast("正在下载 " + p.name + " …");
    fetch(BASE + "/api/plugins/" + encodeURIComponent(p.id) + "/download", {
      headers: { Authorization: "Bearer " + session.token },
    })
      .then(function (res) {
        if (!res.ok) throw new Error("下载失败");
        return res.arrayBuffer();
      })
      .then(function (buf) {
        return window.magicHub.installPlugin(p.id, buf);
      })
      .then(function (info) {
        marketToast("插件「" + info.name + "」安装成功");
        return window.magicHub.listLocalPlugins();
      })
      .then(function (list) { localPlugins = list || []; renderPluginRail(); renderMarket(); })
      .catch(function (err) { marketToast("安装失败：" + (err.message || err)); });
  }

  function uninstallPlugin(id) {
    if (!window.magicHub || !window.magicHub.uninstallPlugin) {
      marketToast("请在桌面客户端中卸载插件");
      return;
    }
    window.magicHub.uninstallPlugin(id)
      .then(function () {
        marketToast("插件已卸载");
        return window.magicHub.listLocalPlugins();
      })
      .then(function (list) { localPlugins = list || []; renderPluginRail(); renderMarket(); })
      .catch(function (err) { marketToast("卸载失败：" + (err.message || err)); });
  }

  // 上传 .7z 插件包到服务器
  function uploadPluginPack(file) {
    if (!/\.7z$/i.test(file.name)) {
      marketToast("请选择 .7z 格式的插件包（可用 tools/plugin-pack.py 生成）");
      return;
    }
    if (file.size > 10 * 1024 * 1024) { marketToast("插件包不能超过 10MB"); return; }
    marketToast("正在上传 " + file.name + " …");
    var fr = new FileReader();
    fr.onload = function () {
      var data = fr.result; // dataURL
      fetch(BASE + "/api/plugins/upload", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.token },
        body: JSON.stringify({ name: file.name, data: data }),
      })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) {
            marketToast("插件「" + d.data.name + "」已发布到服务器（默认为私有，可在市场中设为公开）");
            return fetch(BASE + "/api/plugins").then(function (r) { return r.json(); });
          }
          throw new Error((d.error && d.error.message) || "上传失败");
        })
        .then(function (d) {
          marketPlugins = (d.ok && d.data && d.data.plugins) || [];
          renderMarket();
        })
        .catch(function (err) { marketToast("上传失败：" + (err.message || err)); });
    };
    fr.readAsDataURL(file);
  }

  $("pluginUploadBtn").addEventListener("click", function () { $("pluginPackInput").click(); });
  $("pluginPackInput").addEventListener("change", function () {
    if (this.files && this.files[0]) uploadPluginPack(this.files[0]);
    this.value = "";
  });
  $("marketBody").addEventListener("click", function (e) {
    var btn = e.target.closest(".mkt-btn");
    if (!btn) return;
    var act = btn.getAttribute("data-act"), id = btn.getAttribute("data-id");
    var p = marketPlugins.find(function (x) { return x.id === id; }) || {};
    if (act === "install") installPlugin(p);
    else if (act === "uninstall") uninstallPlugin(id);
    else if (act === "delete") {
      if (!confirm("确定删除插件「" + (p.name || id) + "」？服务器与市场中的该插件都会被删除。")) return;
      fetch(BASE + "/api/plugins/" + encodeURIComponent(id), {
        method: "DELETE",
        headers: { Authorization: "Bearer " + session.token },
      })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error((d.error && d.error.message) || "删除失败");
          marketToast("插件已删除");
          return fetch(BASE + "/api/plugins").then(function (r) { return r.json(); });
        })
        .then(function (d) { marketPlugins = (d.ok && d.data && d.data.plugins) || []; renderMarket(); })
        .catch(function (err) { marketToast("删除失败：" + (err.message || err)); });
    } else if (act === "toggle") {
      var toPublic = p.public === false;
      fetch(BASE + "/api/plugins/" + encodeURIComponent(id) + "/visibility", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.token },
        body: JSON.stringify({ public: toPublic }),
      })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (!d.ok) throw new Error((d.error && d.error.message) || "设置失败");
          marketToast(toPublic ? "插件已公开，所有用户可见" : "插件已设为私有");
          return fetch(BASE + "/api/plugins").then(function (r) { return r.json(); });
        })
        .then(function (d) { marketPlugins = (d.ok && d.data && d.data.plugins) || []; renderMarket(); })
        .catch(function (err) { marketToast("设置失败：" + (err.message || err)); });
    }
  });
  $("pluginClose").addEventListener("click", function () {
    showChat(); clearRailActive(); railItems[0].classList.add("on");
    if (location.hash) history.replaceState(null, "", location.pathname);
  });

  /* ===== hash 路由：#plugin/<id> / #contacts / #settings ===== */
  function openByHash() {
    var m = /^#plugin\/([^/]+)/.exec(location.hash);
    if (m && pluginEntries[m[1]]) {
      clearRailActive();
      showPlugin(m[1], pluginEntries[m[1]]);
      return;
    }
    if (location.hash === "#contacts") {
      clearRailActive();
      railItems[1].classList.add("on");
      showContacts();
      return;
    }
    if (location.hash === "#market") {
      clearRailActive();
      var mi = railItems.findIndex(function (x) { return x.getAttribute("data-view") === "market"; });
      if (mi >= 0) railItems[mi].classList.add("on");
      showMarket();
      return;
    }
    if (location.hash === "#settings") {
      clearRailActive();
      railItems[railItems.length - 1].classList.add("on");
      showSettings();
      return;
    }
    showChat(); clearRailActive(); railItems[0].classList.add("on");
  }
  window.addEventListener("hashchange", openByHash);

  /* ===== 工具：头像与时间 ===== */
  function avatarHTML(u) {
    var letter = (u.displayName || u.username).charAt(0).toUpperCase();
    return '<span class="avatar" style="background:var(--grad)"><span class="av-fallback">' + letter + '</span>' +
      (u.avatar ? '<img src="' + BASE + u.avatar + '" alt="" onerror="this.remove()">' : '') + '</span>';
  }
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) {
      return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    }
    var yest = new Date(now); yest.setDate(now.getDate() - 1);
    if (d.toDateString() === yest.toDateString()) return "昨天";
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "月" + d.getDate() + "日";
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function fmtSize(n) {
    if (!n) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(1) + " MB";
  }
  /** 会话列表预览：文本 / 图片 / 文件 */
  function previewText(m) {
    if (!m.file) return m.text || "";
    if (/^image\//.test(m.file.type)) return "[图片] " + m.file.name;
    return "[文件] " + m.file.name;
  }
  function fileCardHTML(f) {
    return '<div class="file-card">' +
      '<span class="file-ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></svg></span>' +
      '<span class="file-info"><span class="file-name">' + escapeHtml(f.name) + '</span>' +
      '<span class="file-size">' + fmtSize(f.size) + '</span></span>' +
      '<a class="file-dl" href="' + BASE + f.url + '" target="_blank" rel="noopener" download="' + escapeHtml(f.name) + '">下载</a></div>';
  }
  function showLightbox(src) {
    $("lightboxImg").src = src;
    $("lightbox").classList.add("show");
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeReg(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  /* ===== 会话列表（好友会话，最后消息预览 + 未读红点 + 搜索过滤） ===== */
  var chatList = $("chatList");
  var activeConv = null;
  var convMeta = {}; // convId -> { id, peer, unread }
  var lastConvs = [];
  var convSearchKw = "";

  function renderConvs() {
    var kw = convSearchKw;
    var convs = lastConvs;
    convMeta = {};
    chatList.innerHTML = "";
    var shown = convs.filter(function (c) {
      if (!kw) return true;
      var name = (c.peer.displayName || c.peer.username).toLowerCase();
      var last = c.last ? c.last.text.toLowerCase() : "";
      return name.indexOf(kw) >= 0 || last.indexOf(kw) >= 0;
    });
    if (shown.length === 0) {
      chatList.innerHTML = '<div class="c-prev" style="padding:16px;text-align:center;color:var(--text-3)">' +
        (convs.length === 0 ? "暂无会话<br>去「通讯录」添加好友" : "没有匹配的会话或消息") + '</div>';
      return;
    }
    shown.forEach(function (c) {
      convMeta[c.id] = c;
      var el = document.createElement("div");
      el.className = "chat-item" + (c.id === activeConv ? " on" : "");
      el.setAttribute("data-conv", c.id);
      var last = c.last
        ? (c.last.from === session.username ? "我：" : "") + previewText(c.last)
        : "你们已成为好友，开始聊天吧";
      var badgeHtml = c.unread > 0 ? '<span class="badge">' + (c.unread > 99 ? "99+" : c.unread) + '</span>' : "";
      el.innerHTML = '<span class="av-wrap">' + avatarHTML(c.peer) + badgeHtml + '</span>' +
        '<div class="c-main"><div class="c-row"><span class="c-name">' + (c.peer.displayName || c.peer.username) + '</span>' +
        '<span class="c-time">' + fmtTime(c.last && c.last.ts) + '</span></div>' +
        '<div class="c-prev"></div></div>';
      el.querySelector(".c-prev").textContent = last;
      el.addEventListener("click", function () { openConv(c.id); });
      chatList.appendChild(el);
    });
  }

  function updateConvBadge(convId, n) {
    var el = chatList.querySelector('[data-conv="' + convId + '"]');
    if (!el) return;
    var wrap = el.querySelector(".av-wrap");
    var badge = el.querySelector(".badge");
    if (n > 0) {
      if (!badge) {
        badge = document.createElement("span");
        badge.className = "badge";
        wrap.appendChild(badge);
      }
      badge.textContent = n > 99 ? "99+" : n;
    } else if (badge) {
      badge.remove();
    }
  }

  function loadConvs() {
    fetch(BASE + "/api/conversations", { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        lastConvs = (data.ok && data.data && data.data.conversations) || [];
        renderConvs();
      })
      .catch(function () { /* 后端未启动 */ });
  }

  $("convSearch").addEventListener("input", function () {
    convSearchKw = this.value.trim().toLowerCase();
    renderConvs();
  });

  /* ===== 打开会话：标记已读 + 加载历史 + 可发送 ===== */
  function openConv(convId) {
    activeConv = convId;
    setChatChrome(true);
    Array.prototype.forEach.call(chatList.children, function (el) {
      el.classList.toggle("on", el.getAttribute("data-conv") === convId);
    });
    var meta = convMeta[convId];
    if (meta) {
      $("chatName").textContent = meta.peer.displayName || meta.peer.username;
      $("peerAv").innerHTML = avatarHTML(meta.peer);
      // 标记已读：清零未读角标
      if (meta.unread > 0) {
        meta.unread = 0;
        updateConvBadge(convId, 0);
        fetch(BASE + "/api/conversations/read", {
          method: "POST",
          headers: authHeaders(true),
          body: JSON.stringify({ convId: convId }),
        }).catch(function () { /* 失败下次再清 */ });
      }
    }

    var area = $("msgArea");
    var empty = $("emptyTip");
    // 只清历史消息气泡，保留 emptyTip 占位节点（后续渲染依赖它）
    area.querySelectorAll(".msg").forEach(function (el) { el.remove(); });
    empty.style.display = "none";

    // 先渲染本地缓存（前端本地保存最近记录，弱网/离线也能立即看到）
    var cached = readMsgCache(convId);
    cached.forEach(function (m) { appendMsg(m, m.from === session.username); });
    if (cached.length) area.scrollTop = area.scrollHeight;

    fetch(BASE + "/api/messages?conv=" + encodeURIComponent(convId), { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok) {
          if (!cached.length) {
            empty.style.display = "";
            $("emptyText").textContent = (data.error && data.error.message) || "无法加载消息";
          }
          return;
        }
        var msgs = data.data.messages || [];
        writeMsgCache(convId, msgs);
        // 用服务器最新记录替换缓存气泡，避免重复
        area.querySelectorAll(".msg").forEach(function (el) { el.remove(); });
        if (msgs.length === 0) {
          empty.style.display = "";
          $("emptyText").textContent = "你们已成为好友，发一条消息打个招呼吧";
          return;
        }
        msgs.forEach(function (m) { appendMsg(m, m.from === session.username); });
        area.scrollTop = area.scrollHeight;
      })
      .catch(function () { if (!cached.length) empty.style.display = ""; });

    var connected = ws && ws.readyState === WebSocket.OPEN;
    $("input").disabled = !connected;
    $("sendBtn").disabled = !connected;
  }

  /* ===== 消息本地缓存：前端保存最近记录，打开会话先显示缓存再向后端刷新 ===== */
  function msgCacheKey(convId) { return "mh_msg_cache_" + convId; }
  function readMsgCache(convId) {
    try { return JSON.parse(localStorage.getItem(msgCacheKey(convId))) || []; }
    catch (e) { return []; }
  }
  function writeMsgCache(convId, msgs) {
    try { localStorage.setItem(msgCacheKey(convId), JSON.stringify(msgs.slice(-60))); }
    catch (e) { /* 容量不足时忽略 */ }
  }

  function appendMsg(m, mine) {
    var area = $("msgArea");
    $("emptyTip").style.display = "none";
    var div = document.createElement("div");
    div.className = "msg " + (mine ? "out" : "in");
    var bubble = document.createElement("div");
    if (m.file && /^image\//.test(m.file.type)) {
      bubble.className = "bubble has-img";
      var img = document.createElement("img");
      img.className = "msg-img";
      img.src = BASE + m.file.url;
      img.alt = m.file.name;
      img.loading = "lazy";
      img.addEventListener("load", function () { area.scrollTop = area.scrollHeight; });
      img.addEventListener("click", function () { showLightbox(this.src); });
      bubble.appendChild(img);
    } else if (m.file) {
      bubble.className = "bubble";
      bubble.innerHTML = fileCardHTML(m.file);
    } else {
      bubble.className = "bubble";
      bubble.textContent = m.text;
    }
    div.appendChild(bubble);
    var time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = fmtTime(m.ts);
    div.appendChild(time);
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    // 消息搜索激活时对新消息同步过滤
    if (msgSearchInput && msgSearchInput.value.trim()) applyMsgSearch();
  }

  /* ===== 发送消息（含失败重试） ===== */
  function postMessage(body, onOk) {
    return fetch(BASE + "/api/messages", {
      method: "POST",
      headers: authHeaders(true),
      body: JSON.stringify(body),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.ok) { onOk(data.data); return true; }
        toast((data.error && data.error.message) || "发送失败");
        return false;
      })
      .catch(function () { toast("发送失败，请检查后端服务"); return false; });
  }

  function sendText(text) {
    var input = $("input");
    if (!text || !activeConv || !ws || ws.readyState !== WebSocket.OPEN) return;
    input.value = "";
    postMessage({ convId: activeConv, text: text }, function (d) {
      appendMsg(d.msg, true);
      loadConvs();
    }).then(function (ok) {
      if (!ok) showFailMsg(text, null);
    });
  }

  /** 失败消息气泡：显示"发送失败，点击重试"，点击重新发送 */
  function showFailMsg(text, file) {
    var area = $("msgArea");
    $("emptyTip").style.display = "none";
    var div = document.createElement("div");
    div.className = "msg out fail";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text || (file && file.name) || "消息发送失败";
    var tag = document.createElement("div");
    tag.className = "retry-tag";
    tag.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg>发送失败，点击重试';
    div.appendChild(bubble);
    div.appendChild(tag);
    div.addEventListener("click", function () {
      div.style.opacity = ".5";
      postMessage(
        { convId: activeConv, text: text || "", file: file ? { name: file.name, type: file.type, size: file.size, data: file.data } : undefined },
        function (d) {
          div.remove();
          appendMsg(d.msg, true);
          loadConvs();
        }
      ).then(function (ok) {
        if (!ok) div.style.opacity = "1";
      });
    });
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  /** 图片：canvas 压缩到最长边 1280 / JPEG 0.82 */
  function compressImage(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var MAX = 1280;
      var scale = Math.min(1, MAX / Math.max(img.width, img.height));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function canSendFile() {
    if (!activeConv) { toast("请先选择一个会话"); return false; }
    if (!ws || ws.readyState !== WebSocket.OPEN) { toast("未连接到服务器"); return false; }
    return true;
  }

  function sendImageMsg(file) {
    if (!canSendFile()) return;
    compressImage(file, function (dataUrl) {
      if (!dataUrl) { toast("图片读取失败"); return; }
      var size = Math.round(dataUrl.length * 0.75);
      postMessage({
        convId: activeConv,
        text: "",
        file: { name: file.name.replace(/\.[^.]+$/, ".jpg") || "image.jpg", type: "image/jpeg", size: size, data: dataUrl },
      }, function (d) {
        appendMsg(d.msg, true);
        loadConvs();
      }).then(function (ok) {
        if (!ok) showFailMsg(null, { name: file.name, type: "image/jpeg", size: size, data: dataUrl });
      });
    });
  }

  function sendFileMsg(file) {
    if (!canSendFile()) return;
    if (file.size > 8 * 1024 * 1024) { toast("文件不能超过 8MB"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var b64 = reader.result.split(",")[1];
      postMessage({
        convId: activeConv,
        text: "",
        file: { name: file.name, type: file.type || "application/octet-stream", size: file.size, data: b64 },
      }, function (d) {
        appendMsg(d.msg, true);
        loadConvs();
      }).then(function (ok) {
        if (!ok) showFailMsg(null, { name: file.name, type: file.type, size: file.size, data: b64 });
      });
    };
    reader.onerror = function () { toast("文件读取失败"); };
    reader.readAsDataURL(file);
  }

  function send() {
    sendText($("input").value.trim());
  }
  $("sendBtn").addEventListener("click", send);
  $("input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* 附件按钮 + 图片/文件选择 */
  var attachBtn = $("attachBtn"), attachPop = $("attachPop");
  attachBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    attachPop.classList.toggle("show");
  });
  document.addEventListener("click", function () { attachPop.classList.remove("show"); });
  $("pickImage").addEventListener("click", function () { attachPop.classList.remove("show"); $("imageInput").click(); });
  $("pickFile").addEventListener("click", function () { attachPop.classList.remove("show"); $("fileInput").click(); });
  $("imageInput").addEventListener("change", function () {
    if (this.files && this.files[0]) sendImageMsg(this.files[0]);
    this.value = "";
  });
  $("fileInput").addEventListener("change", function () {
    if (this.files && this.files[0]) sendFileMsg(this.files[0]);
    this.value = "";
  });

  /* 图片查看灯箱 */
  $("lightbox").addEventListener("click", function () { this.classList.remove("show"); });

  /* ===== 好友资料卡弹窗 ===== */
  var cardMask = $("cardMask");
  function openCard() {
    if (!activeConv || !convMeta[activeConv]) return;
    var p = convMeta[activeConv].peer;
    $("cardAvatar").innerHTML = avatarHTML(p);
    $("cardName").textContent = p.displayName || p.username;
    $("cardAcc").textContent = "账号：" + p.username;
    cardMask.hidden = false;
  }
  $("peerBtn").addEventListener("click", openCard);
  $("cardClose").addEventListener("click", function () { cardMask.hidden = true; });
  $("cardMsgBtn").addEventListener("click", function () { cardMask.hidden = true; });
  cardMask.addEventListener("click", function (e) { if (e.target === cardMask) cardMask.hidden = true; });

  /* ===== 消息搜索（当前会话内过滤 + 高亮） ===== */
  var msgSearch = $("msgSearch");
  var msgSearchInput = $("msgSearchInput");
  var msgSearchCount = $("msgSearchCount");
  function applyMsgSearch() {
    var kw = msgSearchInput.value.trim().toLowerCase();
    var count = 0;
    Array.prototype.forEach.call($("msgArea").querySelectorAll(".msg"), function (m) {
      var bubble = m.querySelector(".bubble");
      var text = bubble ? bubble.textContent : "";
      var hit = !!kw && text.toLowerCase().indexOf(kw) >= 0;
      m.style.display = hit ? "" : "none";
      if (hit) count++;
      if (bubble) {
        bubble.innerHTML = escapeHtml(text);
        if (kw) {
          bubble.innerHTML = bubble.innerHTML.replace(new RegExp(escapeReg(kw), "gi"),
            function (x) { return '<span class="hl">' + x + '</span>'; });
        }
      }
    });
    msgSearchCount.textContent = kw ? count + " 条匹配" : "";
  }
  $("msgSearchBtn").addEventListener("click", function () {
    msgSearch.style.display = "flex";
    msgSearchInput.focus();
  });
  $("msgSearchClose").addEventListener("click", function () {
    msgSearch.style.display = "none";
    msgSearchInput.value = "";
    applyMsgSearch();
  });
  msgSearchInput.addEventListener("input", applyMsgSearch);

  /* ===== 通讯录：所有用户（只能查看/加好友，不能发消息） ===== */
  var userListEl = $("userList");
  var userDetailEl = $("userDetail");
  var selectedUser = null;

  function renderDetail(u) {
    var letter = (u.displayName || u.username).charAt(0).toUpperCase();
    var avatarHtml = u.avatar
      ? '<div class="big-avatar" style="background:var(--grad)"><img src="' + BASE + u.avatar + '" alt="" onerror="this.remove()"></div>'
      : '<div class="big-avatar">' + letter + '</div>';
    var btn = u.isFriend
      ? '<button class="add-btn added" disabled>已添加好友</button>'
      : '<button class="add-btn" id="detailAdd">添加好友</button>';
    userDetailEl.innerHTML = avatarHtml +
      '<div class="d-name">' + (u.displayName || u.username) + '</div>' +
      '<div class="d-tip">账号：' + u.username + '</div>' +
      '<div class="d-tip">' + (u.isFriend ? "你们已是好友，可在「会话」中聊天" : "添加好友后，即可在「会话」中聊天") + '</div>' + btn;
    var addBtn = $("detailAdd");
    if (addBtn) addBtn.addEventListener("click", function () { addFriend(u.username); });
  }

  function loadUsers() {
    fetch(BASE + "/api/users", { headers: authHeaders() })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var users = (data.ok && data.data && data.data.users) || [];
        userListEl.innerHTML = "";
        if (users.length === 0) {
          userListEl.innerHTML = '<div class="c-prev" style="padding:16px;text-align:center;color:var(--text-3)">暂无其他用户</div>';
          return;
        }
        users.forEach(function (u) {
          var el = document.createElement("div");
          el.className = "c-item";
          el.innerHTML = avatarHTML(u) +
            '<div class="ci-main"><div class="ci-name">' + (u.displayName || u.username) + '</div>' +
            '<div class="ci-acc">' + u.username + '</div></div>' +
            (u.isFriend
              ? '<button class="add-btn added" disabled>已添加</button>'
              : '<button class="add-btn" data-add="' + u.username + '">添加</button>');
          el.addEventListener("click", function () {
            Array.prototype.forEach.call(userListEl.children, function (x) { x.classList.remove("on"); });
            el.classList.add("on");
            selectedUser = u;
            renderDetail(u);
          });
          var addBtn = el.querySelector("[data-add]");
          if (addBtn) addBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            addFriend(u.username);
          });
          userListEl.appendChild(el);
        });
        if (selectedUser) {
          var match = users.filter(function (u) { return u.username === selectedUser.username; })[0];
          if (match) { selectedUser = match; renderDetail(match); }
        }
      })
      .catch(function () { /* 后端未启动 */ });
  }

  function addFriend(username) {
    fetch(BASE + "/api/friends/add", {
      method: "POST",
      headers: authHeaders(true),
      body: JSON.stringify({ username: username }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.ok) {
          toast("已添加好友，去「会话」开始聊天吧");
          loadUsers();
          loadConvs();
        } else {
          toast((data.error && data.error.message) || "添加失败");
        }
      })
      .catch(function () { toast("添加失败，请检查后端服务"); });
  }

  /* ===== WebSocket：认证 + 新消息推送 ===== */
  var statusEl = $("status");
  var statusText = $("statusText");
  var msgArea = $("msgArea");
  var emptyTip = $("emptyTip");
  var input = $("input");
  var sendBtn = $("sendBtn");
  var ws = null;
  var retryTimer = null;

  function setStatus(state, text) {
    statusEl.classList.remove("on", "err");
    if (state === "on") statusEl.classList.add("on");
    if (state === "err") statusEl.classList.add("err");
    statusText.textContent = text;
  }
  function setInputEnabled(en) {
    input.disabled = !en;
    sendBtn.disabled = !en;
    $("attachBtn").disabled = !en;
  }

  function connect() {
    clearTimeout(retryTimer);
    setStatus("", "连接中…");
    ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      setStatus("", "认证中…");
      ws.send(JSON.stringify({ type: "auth", token: session.token }));
    };
    ws.onmessage = function (ev) {
      var frame;
      try { frame = JSON.parse(ev.data); } catch (e) { return; }
      if (frame.type === "auth_ok") {
        setStatus("on", "已连接");
        if (activeConv) {
          setInputEnabled(true);
          // 重连成功后重新拉取当前会话，保证与其他客户端/窗口保持同步
          openConv(activeConv);
        }
      } else if (frame.type === "auth_fail") {
        setStatus("err", "登录已过期");
        setInputEnabled(false);
      } else if (frame.type === "message") {
        var d = frame.data || {};
        if (activeConv && d.convId === activeConv) {
          appendMsg(d.msg, false);
          // 正在看该会话：服务端计数置 0（若对方刚发来）
          if (convMeta[d.convId] && convMeta[d.convId].unread > 0) {
            convMeta[d.convId].unread = 0;
            updateConvBadge(d.convId, 0);
          }
          fetch(BASE + "/api/conversations/read", {
            method: "POST",
            headers: authHeaders(true),
            body: JSON.stringify({ convId: d.convId }),
          }).catch(function () {});
          loadConvs();
        } else {
          // 非当前会话：未读 +1 并显示角标
          if (convMeta[d.convId]) {
            convMeta[d.convId].unread = (convMeta[d.convId].unread || 0) + 1;
            updateConvBadge(d.convId, convMeta[d.convId].unread);
          }
          toast("收到新消息");
          loadConvs();
        }
      }
    };
    ws.onclose = function () {
      setStatus("err", "已断开 · 3 秒后重连");
      setInputEnabled(false);
      retryTimer = setTimeout(connect, 3000);
    };
    ws.onerror = function () { /* onclose 统一处理 */ };
  }

  loadPlugins();
  connect();
})();
</script>
</body>
</html>
