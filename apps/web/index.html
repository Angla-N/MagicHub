<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicHub 主界面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237C3AED'/%3E%3Cpath d='M8 14h48v30H38l-8 12v-12H8z' fill='%23EDE9FE'/%3E%3Ccircle cx='22' cy='29' r='3' fill='%23A855F7'/%3E%3Ccircle cx='42' cy='29' r='3' fill='%23A855F7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/chat.css">
<style>
  /* —— 页面专属：窗口化主界面布局 —— */
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .app-shell{height:calc(100vh - 46px);border-radius:0;border:none;box-shadow:none}

  /* 头像：方形圆角（非圆形） */
  .rail-avatar{width:38px;height:38px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;
    margin-bottom:14px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(124,58,237,.45);overflow:hidden}
  .rail-avatar img{width:100%;height:100%;object-fit:cover}
  .rail-plugins{display:flex;flex-direction:column;align-items:center;gap:6px}
  .rail-plugins .rail-item img{width:20px;height:20px;border-radius:5px}

  /* 会话列表：仅聊天视图显示；其余视图内容占满整个主区域 */
  body:not(.chat-mode) .list-pane{display:none!important}
  @media(min-width:820px){body.chat-mode .list-pane{display:flex}}
  @media(max-width:819px){.list-pane{display:none!important}}

  /* 插件视图：占满聊天区剩余空间 */
  .plugin-view{display:flex;flex-direction:column;min-width:0;background:var(--bg-soft);flex:1}
  .plugin-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .plugin-head h4{font-size:14px;font-weight:700}
  .plugin-frame{flex:1;min-height:0;border:none;background:var(--bg)}

  /* 占位视图（联系人/文件/通知/设置 演示） */
  .ph-view{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-3);font-size:13px;min-width:0}
  .ph-view svg{opacity:.6}
</style>
</head>
<body>

<!-- ===== 窗口标题栏 ===== -->
<header class="titlebar">
  <div class="logo"><span class="logo-badge"><svg viewBox="0 0 1077.9 1024" fill="none"><path d="M0 0h1077.9v808.4h-246.2l-35 215.6-379.1-215.6H0V0z" fill="#fff"/><path d="M269.5 323.4h107.8v161.7H269.5zM646.7 323.4h107.8v161.7H646.7z" fill="#fff"/></svg></span>MagicHub</div>
  <span class="title" id="viewTitle">会话</span>
  <div class="win-controls" aria-label="窗口控制">
    <button id="winMin" title="最小化"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="winMax" title="最大化/还原"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    <button class="close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<div class="app-shell" id="appShell">
  <!-- ===== 左侧导航栏（QQ 风格） ===== -->
  <nav class="rail" aria-label="主导航">
    <button class="rail-avatar" id="avatarBtn" title="账号"></button>

    <button class="rail-item on" data-view="chat" title="会话"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></button>
    <button class="rail-item" data-view="contacts" title="联系人"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 2.6-5 5.5-5s4.9 1.6 5.5 5M16 5.6a3 3 0 0 1 0 5.4M17.6 14.4c1.6.8 2.5 2.2 2.9 4.1"/></svg></button>
    <button class="rail-item" data-view="files" title="文件"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></button>
    <button class="rail-item" data-view="notices" title="通知"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 21h4"/></svg></button>

    <span class="rail-sep"></span>

    <!-- 插件区：由 /api/plugins 动态渲染 -->
    <div class="rail-plugins" id="pluginRail"></div>
    <span class="rail-sep" id="pluginSep" hidden></span>

    <button class="rail-item" data-view="settings" title="设置"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.3 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2l.3 2.6h4l.3-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
  </nav>

  <!-- ===== 内容区：会话栏（仅聊天视图）+ 主视图 ===== -->
  <div class="app-main">

  <!-- ===== 会话列表（仅聊天视图显示） ===== -->
  <aside class="list-pane">
    <div class="list-head">
      <h3>会话</h3>
      <div class="search"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input placeholder="搜索会话或消息"></div>
    </div>
    <div class="list" id="chatList">
      <div class="chat-item on" data-name="产品设计群"><span class="avatar" style="background:linear-gradient(135deg,#7C3AED,#A855F7)">群</span><div class="c-main"><div class="c-row"><span class="c-name">产品设计群</span><span class="c-time">09:21</span></div><div class="c-prev">小狼：新版聊天界面已经更新完成</div></div><span class="badge">3</span></div>
      <div class="chat-item" data-name="周工"><span class="avatar" style="background:linear-gradient(135deg,#2563EB,#38BDF8)">周</span><div class="c-main"><div class="c-row"><span class="c-name">周工</span><span class="c-time">昨天</span></div><div class="c-prev">收到，我这就去看。</div></div></div>
      <div class="chat-item" data-name="MagicHub 官方"><span class="avatar" style="background:linear-gradient(135deg,#7C3AED,#A855F7)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 19h14"/></svg></span><div class="c-main"><div class="c-row"><span class="c-name">MagicHub 官方</span><span class="c-time">昨天</span></div><div class="c-prev">欢迎使用 MagicHub</div></div><span class="badge">1</span></div>
      <div class="chat-item" data-name="林一"><span class="avatar" style="background:linear-gradient(135deg,#E05C8A,#F472B6)">林</span><div class="c-main"><div class="c-row"><span class="c-name">林一</span><span class="c-time">周一</span></div><div class="c-prev">会议纪要发你邮箱了</div></div></div>
      <div class="chat-item" data-name="Rust 扩展讨论组"><span class="avatar" style="background:linear-gradient(135deg,#2FB36A,#34D399)">R</span><div class="c-main"><div class="c-row"><span class="c-name">Rust 扩展讨论组</span><span class="c-time">周一</span></div><div class="c-prev">N-API 基准测试结果</div></div><span class="badge">12</span></div>
    </div>
  </aside>

  <!-- ===== 聊天主区 ===== -->
  <main class="chat-pane">
    <!-- 聊天视图 -->
    <div class="chat-view" id="chatView" style="display:flex;flex-direction:column;min-width:0;flex:1">
      <div class="chat-head">
        <span class="dot"></span>
        <h4 id="chatName">产品设计群</h4>
        <div class="tools">
          <button class="icon-btn" title="语音通话（演示）"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 16 0M7 12a5 5 0 0 1 10 0M10 12a2 2 0 0 1 4 0"/></svg></button>
          <button class="icon-btn" title="文件传输（规划中）"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></button>
          <button class="icon-btn" title="更多"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
        </div>
        <div class="status" id="status"><i></i><span id="statusText">未连接</span></div>
      </div>
      <div class="msg-area" id="msgArea">
        <div class="empty" id="emptyTip">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
          <span>连接后端后自动收发（<b style="color:var(--text-2)">apps/server · npm start</b>）<br>输入消息并发送，广播消息将原样回显</span>
        </div>
      </div>
      <div class="input-bar">
        <button class="icon-btn" title="表情（演示）"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
        <textarea id="input" placeholder="输入消息，Enter 发送" disabled></textarea>
        <button class="send" id="sendBtn" disabled>发送</button>
      </div>
    </div>

    <!-- 插件视图（占满聊天区） -->
    <div class="plugin-view" id="pluginView" style="display:none">
      <div class="plugin-head">
        <span class="dot"></span>
        <h4 id="pluginTitle">插件</h4>
        <div class="tools"><button class="icon-btn" id="pluginClose" title="关闭插件"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      </div>
      <iframe class="plugin-frame" id="pluginFrame" title="插件内容" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <!-- 占位视图（其余导航项演示） -->
    <div class="ph-view" id="phView" style="display:none;flex:1">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
      <span id="phText">功能开发中，敬请期待</span>
    </div>
  </main>
  </div><!-- /app-main -->
</div>

<div id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ===== 服务地址：Electron 由主进程注入，H5 默认本地后端 ===== */
  var BASE = (window.magicHub && window.magicHub.serverBase) || "http://localhost:3000";
  var WS_URL = BASE.replace(/^http/, "ws") + "/";

  /* ===== 登录门禁：必须真实登录后才能进入主界面 ===== */
  var sessionStr = localStorage.getItem("magichub_session");
  if (!sessionStr) {
    location.replace("login.html");
    return;
  }
  var session;
  try { session = JSON.parse(sessionStr); } catch (e) { session = null; }
  if (!session || !session.username) {
    localStorage.removeItem("magichub_session");
    location.replace("login.html");
    return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var toastEl = $("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* ===== 账号头像：方形圆角；点击退出登录 ===== */
  var avatarBtn = $("avatarBtn");
  function renderAvatar() {
    avatarBtn.innerHTML = "";
    if (session.avatar) {
      var img = document.createElement("img");
      img.src = BASE + session.avatar;
      img.alt = session.displayName || session.username;
      img.onerror = function () {
        img.remove();
        avatarBtn.textContent = (session.displayName || session.username).charAt(0).toUpperCase();
      };
      avatarBtn.appendChild(img);
    } else {
      avatarBtn.textContent = (session.displayName || session.username).charAt(0).toUpperCase();
    }
    avatarBtn.title = (session.displayName || session.username) + " · 点击退出登录";
  }
  renderAvatar();
  avatarBtn.addEventListener("click", function () {
    localStorage.removeItem("magichub_session");
    location.href = "login.html";
  });

  /* ===== 窗口控制（Electron 下走原生，H5 下演示） ===== */
  var native = window.magicHub || null;
  $("winMin").addEventListener("click", function () { native ? native.minimize() : toast("最小化（演示）"); });
  $("winMax").addEventListener("click", function () { native ? native.maximize() : toast("最大化（演示）"); });
  $("winClose").addEventListener("click", function () { native ? native.close() : toast("关闭（演示）"); });

  /* ===== 导航切换（会话 / 占位视图 / 插件视图） ===== */
  var viewTitle = $("viewTitle");
  var chatView = $("chatView");
  var pluginView = $("pluginView");
  var phView = $("phView");
  var phText = $("phText");
  var appShell = $("appShell");
  var railItems = Array.prototype.slice.call(document.querySelectorAll(".rail-item[data-view]"));
  var pluginEntries = {}; // id -> manifest

  function setListPane(show) {
    document.body.classList.toggle("chat-mode", !!show);
  }
  function showChat() {
    pluginView.style.display = "none";
    phView.style.display = "none";
    chatView.style.display = "flex";
    viewTitle.textContent = "会话";
    setListPane(true);
  }
  function showPh(name) {
    pluginView.style.display = "none";
    phView.style.display = "flex";
    chatView.style.display = "none";
    phText.textContent = name + " · 功能开发中，敬请期待";
    viewTitle.textContent = name;
    setListPane(false);
  }
  function showPlugin(id, meta) {
    chatView.style.display = "none";
    phView.style.display = "none";
    pluginView.style.display = "flex";
    viewTitle.textContent = meta.name;
    $("pluginTitle").textContent = meta.name;
    $("pluginFrame").src = BASE + "/plugins/" + id + "/" + meta.entry;
    setListPane(false);
  }

  function clearRailActive() {
    railItems.forEach(function (x) { x.classList.remove("on"); });
    document.querySelectorAll("#pluginRail .rail-item").forEach(function (x) { x.classList.remove("on"); });
  }

  railItems.forEach(function (item) {
    item.addEventListener("click", function () {
      clearRailActive();
      item.classList.add("on");
      var v = item.getAttribute("data-view");
      if (v === "chat") showChat();
      else showPh(item.title || v);
    });
  });

  /* ===== 插件系统：加载 /api/plugins 并渲染左侧入口（含 SVG 图标） ===== */
  function pluginIconUrl(p) {
    if (!p.icon) return null;
    if (/^(https?:)?\/\//.test(p.icon)) return p.icon;
    return BASE + "/plugins/" + p.id + "/" + p.icon;
  }
  function loadPlugins() {
    fetch(BASE + "/api/plugins")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var list = (data.ok && data.data && data.data.plugins) || [];
        var rail = $("pluginRail");
        rail.innerHTML = "";
        list.forEach(function (p) {
          pluginEntries[p.id] = p;
          var btn = document.createElement("button");
          btn.className = "rail-item";
          btn.title = p.name + "（插件）";
          var icon = pluginIconUrl(p);
          if (icon) {
            var img = document.createElement("img");
            img.src = icon;
            img.alt = "";
            btn.appendChild(img);
          } else {
            btn.textContent = p.name.charAt(0);
            btn.style.fontWeight = "800";
            btn.style.fontSize = "14px";
            btn.style.color = "var(--accent-soft)";
          }
          btn.addEventListener("click", function () {
            clearRailActive();
            btn.classList.add("on");
            showPlugin(p.id, p);
          });
          rail.appendChild(btn);
        });
        $("pluginSep").hidden = list.length === 0;
        openByHash();
      })
      .catch(function () { /* 后端未启动：不渲染插件入口 */ });
  }

  $("pluginClose").addEventListener("click", function () {
    showChat();
    clearRailActive();
    railItems[0].classList.add("on");
    if (location.hash) history.replaceState(null, "", location.pathname);
  });

  /* ===== 会话列表交互 ===== */
  document.querySelectorAll("#chatList .chat-item").forEach(function (item) {
    item.addEventListener("click", function () {
      document.querySelectorAll("#chatList .chat-item").forEach(function (x) { x.classList.remove("on"); });
      item.classList.add("on");
      $("chatName").textContent = item.getAttribute("data-name");
      if (pluginView.style.display === "flex" || phView.style.display === "flex") {
        showChat();
        clearRailActive();
        railItems[0].classList.add("on");
      }
    });
  });

  /* ===== hash 路由：#plugin/<id> 直接打开插件视图 ===== */
  function openByHash() {
    var m = /^#plugin\/([^/]+)/.exec(location.hash);
    if (m && pluginEntries[m[1]]) {
      clearRailActive();
      var btn = document.querySelector('#pluginRail .rail-item[data-pid="' + m[1] + '"]');
      if (btn) btn.classList.add("on");
      showPlugin(m[1], pluginEntries[m[1]]);
    } else {
      showChat();
      clearRailActive();
      railItems[0].classList.add("on");
    }
  }
  window.addEventListener("hashchange", openByHash);

  /* ===== WebSocket：连接 + 广播 ===== */
  var statusEl = $("status");
  var statusText = $("statusText");
  var msgArea = $("msgArea");
  var input = $("input");
  var sendBtn = $("sendBtn");
  var emptyTip = $("emptyTip");
  var ws = null;
  var retryTimer = null;

  function setStatus(state, text) {
    statusEl.classList.remove("on", "err");
    if (state === "on") statusEl.classList.add("on");
    if (state === "err") statusEl.classList.add("err");
    statusText.textContent = text;
  }
  function addSystem(text) {
    emptyTip.style.display = "none";
    var div = document.createElement("div");
    div.className = "system";
    div.textContent = text;
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }
  function addMessage(text, mine) {
    emptyTip.style.display = "none";
    var div = document.createElement("div");
    div.className = "msg " + (mine ? "out" : "in");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    div.appendChild(bubble);
    msgArea.appendChild(div);
    msgArea.scrollTop = msgArea.scrollHeight;
  }
  function connect() {
    clearTimeout(retryTimer);
    setStatus("", "连接中…");
    ws = new WebSocket(WS_URL);
    ws.onopen = function () {
      setStatus("on", "已连接");
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
      addSystem("已连接到 MagicHub 服务，等待 hello…");
    };
    ws.onmessage = function (ev) {
      var frame;
      try { frame = JSON.parse(ev.data); } catch (e) { return; }
      if (frame.type === "hello") {
        addSystem("服务端握手成功：" + (frame.msg || ""));
      } else if (frame.type === "broadcast") {
        addMessage(String(frame.text), false);
      }
    };
    ws.onclose = function () {
      setStatus("err", "已断开 · 3 秒后重连");
      input.disabled = true;
      sendBtn.disabled = true;
      retryTimer = setTimeout(connect, 3000);
    };
    ws.onerror = function () { /* onclose 统一处理 */ };
  }
  function send() {
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage(text, true);
    ws.send(text);
    input.value = "";
    input.focus();
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  loadPlugins();
  openByHash();
  connect();
})();
</script>
</body>
</html>
