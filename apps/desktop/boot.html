<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MagicHub 客户端</title>
<style>
  html, body { height: 100%; margin: 0; background: #1E1E1E; color: #E8E8E8;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; }
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 32px; -webkit-app-region: drag; z-index: 5; }
  .winbtns { position: fixed; top: 0; right: 0; height: 32px; display: flex; -webkit-app-region: no-drag; z-index: 6; }
  .winbtn { width: 44px; height: 32px; display: flex; align-items: center; justify-content: center;
    color: #9D9D9D; font-size: 14px; cursor: pointer; user-select: none; }
  .winbtn:hover { background: rgba(255,255,255,.06); color: #E8E8E8; }
  .winbtn.close:hover { background: #E05C8A; color: #fff; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .logo { width: 58px; height: 58px; border-radius: 15px; background: linear-gradient(135deg, #7C3AED, #A855F7);
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 24px;
    box-shadow: 0 0 44px rgba(124,58,237,.5); }
  .title { font-size: 17px; font-weight: 600; color: #E8E8E8; }
  .status { font-size: 13px; color: #9D9D9D; min-height: 20px; text-align: center; }
  .row { display: none; align-items: center; gap: 8px; }
  .row.show { display: flex; }
  input { width: 320px; padding: 9px 12px; border-radius: 9px; border: 1px solid #3C3C3C; background: #252526;
    color: #E8E8E8; font-size: 13px; outline: none; box-sizing: border-box; }
  input:focus { border-color: #7C3AED; }
  button { padding: 9px 18px; border: none; border-radius: 9px; background: linear-gradient(135deg, #7C3AED, #A855F7);
    color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  .hint { font-size: 12px; color: #6E6E6E; max-width: 430px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <div class="drag"></div>
  <div class="winbtns">
    <div class="winbtn" onclick="window.magicHub && window.magicHub.minimize()" title="最小化">–</div>
    <div class="winbtn close" onclick="window.magicHub && window.magicHub.close()" title="关闭">✕</div>
  </div>
  <div class="wrap">
    <div class="logo">M</div>
    <div class="title">MagicHub 客户端</div>
    <div class="status" id="status">正在启动…</div>
    <div class="row" id="cfgRow">
      <input id="serverBase" placeholder="http://localhost:3000">
      <button id="retryBtn">保存并重试</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var api = window.magicHub && window.magicHub.boot;
      if (!api) { $("status").textContent = "运行环境异常"; return; }
      api.onStatus(function (msg) {
        $("status").textContent = msg;
        if (msg.indexOf("无法获取") >= 0 || msg.indexOf("失败") >= 0) {
          $("cfgRow").classList.add("show");
          $("hint").textContent = "首次使用需要服务器在线以获取前端脚本；获取一次后会缓存到本地，之后即使服务器不在线也能直接启动。";
          api.getServerBase().then(function (b) { if (b) $("serverBase").value = b; });
        }
      });
      $("retryBtn").addEventListener("click", function () {
        $("cfgRow").classList.remove("show");
        $("status").textContent = "正在重试…";
        api.setServerBase($("serverBase").value.trim() || "http://localhost:3000").then(function () { api.retry(); });
      });
    })();
  </script>
</body>
</html>
